<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stok Portal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f3f5f9;--pa:#fff;--ink:#1b2430;--mut:#6a7585;--ln:#e1e6ee;--ac:#2563eb;--ac2:#1d4ed8;--acl:#e9f0ff;--ok:#15803d;--okl:#e6f6ec;--wr:#b45309;--wrl:#fff3dc;--er:#b91c1c;--erl:#fde8e8;--r:12px}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.top{position:sticky;top:0;z-index:30;background:var(--pa);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:0 16px;height:54px}
.logo{font-weight:700;font-size:15px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 11px;border-radius:9px;color:var(--mut);text-decoration:none;white-space:nowrap;font-weight:500}
nav a:hover{background:#f1f4f9;color:var(--ink)}
nav a.on{background:var(--acl);color:var(--ac)}
.durum{font-size:12px;padding:4px 10px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.durum.ok{background:var(--okl);color:var(--ok)}.durum.wr{background:var(--wrl);color:var(--wr)}.durum.er{background:var(--erl);color:var(--er)}
main{max-width:1320px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:21px;margin:6px 0 2px}h3{font-size:15px;margin:0 0 10px}h3 small{font-weight:400;color:var(--mut)}h4{margin:14px 0 6px;font-size:13px;color:var(--mut)}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--pa);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin-bottom:14px}
details.card summary{cursor:pointer;font-weight:600}
.yardim{margin-top:10px;color:#3c4656}.yardim li{margin:4px 0}
.grid{display:grid;gap:12px;margin-bottom:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.kpi{background:var(--pa);border:1px solid var(--ln);border-radius:var(--r);padding:12px 14px}
.kb{color:var(--mut);font-size:12.5px}.kd{font-size:22px;font-weight:700;margin:2px 0}.ka{color:var(--mut);font-size:12px}
.satir{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-bottom:12px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
label.gen{flex:1;min-width:200px}label.ara{min-width:200px}label.blk{margin-top:10px}
label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px;padding-bottom:8px}
input,select,textarea{font:inherit;color:var(--ink);padding:7px 9px;border:1px solid #cdd5e1;border-radius:8px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd0ff;border-color:var(--ac)}
input[type=checkbox]{padding:0;width:16px;height:16px}
textarea{width:100%}
.in{width:110px}.sag{text-align:right}.nowrap{white-space:nowrap}.kalin{font-weight:700}
.btn{font:inherit;font-weight:600;border:1px solid #cdd5e1;background:#fff;color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer}
.btn:hover{background:#f4f6fa}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.pri:hover{background:var(--ac2)}
.btn.dng{color:var(--er);border-color:#f0b7b7}.btn.dng:hover{background:var(--erl)}
.btn.wr{background:var(--wrl);border-color:#f1d29a;color:var(--wr)}.btn.gh{border-color:transparent;background:transparent;color:var(--ac)}
.btn.kucuk{padding:4px 10px;font-size:12.5px;font-weight:500}
.ib{border:0;background:transparent;cursor:pointer;font-size:15px;padding:4px 6px;border-radius:7px}.ib:hover{background:#eef1f6}
.seg{display:flex;border:1px solid #cdd5e1;border-radius:9px;overflow:hidden;align-self:flex-end}
.seg button{border:0;background:#fff;padding:8px 12px;cursor:pointer;font:inherit;color:var(--mut)}.seg button.on{background:var(--acl);color:var(--ac);font-weight:600}
.tabs{display:flex;gap:4px;margin:6px 0 12px;flex-wrap:wrap}
.tab{border:1px solid var(--ln);background:#fff;padding:7px 14px;border-radius:9px;cursor:pointer;font:inherit;color:var(--mut)}.tab.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.tw{overflow:auto;max-height:68vh;border:1px solid var(--ln);border-radius:10px}
.tbl{border-collapse:collapse;width:100%}
.tbl th{position:sticky;top:0;background:#f6f8fb;text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;z-index:1}
.tbl th.sag{text-align:right}
.tbl td{padding:6px 10px;border-bottom:1px solid #eef1f6;vertical-align:middle}
.tbl tbody tr:hover{background:#fafbfe}
.tbl tfoot td{background:#f6f8fb;border-top:1px solid var(--ln)}
.tbl .alt{font-size:11.5px;color:var(--mut);line-height:1.2}
.tbl.mali{width:100%}.tbl.mali td{padding:7px 4px}.tbl.mali tr.kalin td{border-top:1px solid var(--ln)}
.tbl tr[hidden]{display:none}.tbl tr.fz td{background:#fff8e6}
.uy{font-size:12px;color:var(--wr);white-space:nowrap}.uy.er{color:var(--er);font-weight:600}
.g{color:var(--ok)}.c{color:var(--er)}.mut{color:var(--mut)}.kucuk{font-size:12px}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:#eef1f6;color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--okl);color:var(--ok)}.chip.wr{background:var(--wrl);color:var(--wr)}.chip.er{background:var(--erl);color:var(--er)}
.tk{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:5px;background:#eef2ff;color:#4f46e5;border:1px solid #dfe5ff;vertical-align:middle}
.altbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--ln);position:sticky;bottom:0;background:var(--pa)}
.bos{padding:26px;text-align:center;color:var(--mut);background:#fafbfd;border:1px dashed var(--ln);border-radius:10px}
.adim{line-height:1.8;padding-left:20px}
.uyl{list-style:none;padding:0;margin:0}.uyl li{padding:5px 0;border-bottom:1px solid #f0f2f7}
.dyn .dr{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}.dyn .dr select{flex:1;min-width:260px}
.onizle{margin-top:14px;padding:12px;background:#f8faff;border:1px solid #e1e9fb;border-radius:10px}
.ozs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}.oz{display:flex;flex-direction:column;background:#fff;border:1px solid var(--ln);border-radius:9px;padding:6px 12px}.oz small{color:var(--mut);font-size:11.5px}
.not{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--wrl);color:var(--wr);font-size:13px}.not.er{background:var(--erl);color:var(--er)}
.bar{background:#edf0f6;border-radius:6px;height:10px;width:130px;overflow:hidden;display:inline-block;vertical-align:middle}.bar span{display:block;height:100%;background:var(--ac)}.bar span.ok{background:#22a45d}
.gb{display:grid;grid-template-columns:48px 1fr 110px;gap:8px;align-items:center;margin:4px 0}.gb .bar{width:100%}.gb b{text-align:right;font-weight:600;font-size:12.5px}
#banner{max-width:1320px;margin:0 auto;padding:10px 16px 0}
.ban{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;margin-bottom:8px;font-size:13px}.ban.wr{background:var(--wrl);color:var(--wr)}.ban.er{background:var(--erl);color:var(--er)}
#toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.ti{background:#1f2937;color:#fff;padding:10px 14px;border-radius:10px;max-width:420px;opacity:0;transform:translateY(8px);transition:.25s;box-shadow:0 6px 20px rgba(0,0,0,.2)}.ti.go{opacity:1;transform:none}.ti.er{background:#991b1b}
dialog{border:0;border-radius:14px;padding:0;width:min(640px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(15,23,42,.45)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln)}.mh h3{margin:0}.mb{padding:14px 16px;max-height:65vh;overflow:auto}.ma{padding:12px 16px;border-top:1px solid var(--ln);display:flex;justify-content:flex-end;gap:8px}
.mform{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mform .gen{grid-column:1/-1}
code{background:#eef1f6;padding:1px 6px;border-radius:5px;font-size:12px}
@media (max-width:760px){.cols{grid-template-columns:1fr}.top{gap:8px}.durum{display:none}nav a span{display:none}nav a{padding:8px}}
textarea{resize:vertical}
.izahat{white-space:pre-wrap;border:1px solid var(--ln);background:#fafbfd;border-radius:9px;padding:10px 12px}
#rapor{display:none}
#kilit{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}#kilit[hidden]{display:none}
.kutu{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:22px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.08)}.kutu h2{margin:0}
.btn.blok{width:100%}.kod{font:700 20px/1.4 ui-monospace,Consolas,monospace;letter-spacing:2px;text-align:center;background:#f6f8fb;border:1px dashed #c7d0de;border-radius:10px;padding:14px}#kul{cursor:pointer;border-color:var(--ln)}
.imza{display:flex;gap:60px;margin-top:40px}
@media print{.top,#banner,#toast,.altbar,.btn,.ib,.tabs{display:none!important}body{background:#fff}.card{border:0}
body.rp>*:not(#rapor){display:none!important}body.rp #rapor{display:block;padding:10px;font-size:12px}body.rp .tw{max-height:none;overflow:visible}body.rp .tbl th{position:static}}
</style>
</head>
<body>
<header class="top"><div class="logo">📊 <span id="firma">Stok Portal</span></div><nav id="nav"></nav><button id="kul" class="durum ok" data-act="hesabim" hidden></button><div id="kayit-durum" class="durum ok">⏳ Yükleniyor…</div></header>
<div id="kilit" hidden></div>
<div id="banner"></div>
<main id="app"><div class="bos">Yükleniyor…</div></main>
<div id="toast"></div>
<dialog id="dlg"></dialog>
<div id="rapor"></div>
<input type="file" id="dosya" accept=".json,application/json" hidden>
<input type="file" id="aktar-dosya" accept=".xlsx,.xlsm,.csv,.txt,.tsv,text/csv" hidden>
<script>
