<!DOCTYPE html>
<html lang="tr">
<head>

<style>
:root{--bg:#f3f5f9;--pa:#fff;--ink:#1b2430;--mut:#6a7585;--ln:#e1e6ee;--ac:#2563eb;--ac2:#1d4ed8;--acl:#e9f0ff;--ok:#15803d;--okl:#e6f6ec;--wr:#b45309;--wrl:#fff3dc;--er:#b91c1c;--erl:#fde8e8;--r:12px}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}

nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}

#banner{max-width:1320px;margin:0 auto;padding:10px 16px 0}

dialog{border:0;border-radius:14px;padding:0;width:min(640px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(15,23,42,.45)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln)}.mh h3{margin:0}.mb{padding:14px 16px;max-height:65vh;overflow:auto}.ma{padding:12px 16px;border-top:1px solid var(--ln);display:flex;justify-content:flex-end;gap:8px}
.mform{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mform .gen{grid-column:1/-1}
code{background:#eef1f6;padding:1px 6px;border-radius:5px;font-size:12px}
@media (max-width:760px){.cols{grid-template-columns:1fr}.top{gap:8px}.durum{display:none}nav a span{display:none}nav a{padding:8px}}
textarea{resize:vertical}
.izahat{white-space:pre-wrap;border:1px solid var(--ln);background:#fafbfd;border-radius:9px;padding:10px 12px}
#rapor{display:none}
#kilit{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}#kilit[hidden]{display:none}
.kutu{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:22px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.08)}.kutu h2{margin:0}
.btn.blok{width:100%}.kod{font:700 20px/1.4 ui-monospace,Consolas,monospace;letter-spacing:2px;text-align:center;background:#f6f8fb;border:1px dashed #c7d0de;border-radius:10px;padding:14px}#kul{cursor:pointer;border-color:var(--ln)}
.imza{display:flex;gap:60px;margin-top:40px}
@media print{.top,#banner,#toast,.altbar,.btn,.ib,.tabs{display:none!important}body{background:#fff}.card{border:0}
body.rp>*:not(#rapor){display:none!important}body.rp #rapor{display:block;padding:10px;font-size:12px}body.rp .tw{max-height:none;overflow:visible}body.rp .tbl th{position:static}}
</style>
</head>
<body>
<header class="top"><div class="logo">📊 <span id="firma">Stok Portal</span></div><nav id="nav"></nav><button id="kul" class="durum ok" data-act="hesabim" hidden></button><div id="kayit-durum" class="durum ok">⏳ Yükleniyor…</div></header>

<dialog id="dlg"></dialog>
<div id="rapor"></div>
<input type="file" id="dosya" accept=".json,application/json" hidden>
<input type="file" id="aktar-dosya" accept=".xlsx,.xlsm,.csv,.txt,.tsv,text/csv" hidden>
<script>
'use strict';
// Sürüm bilgisi. Yeni sürüm yayınlarken: SURUM, DEGISIKLIKLER, package.json ve CHANGELOG.md birlikte güncellenir.
const SURUM = '3.2.0';
const VARSAYILAN_REPO = 'aipersonal111-byte/stok-portal';   // güncelleme denetimi bu depodaki version.json'a bakar; kullanıcı bir şey girmez
const VARSAYILAN_DAL = 'main';
const DB_SEMA = 2;           // veri biçimi sürümü: eski dosya, daha yeni biçimdeki veriyi bozmasın diye kontrol edilir
const DEGISIKLIKLER = [

    'Sürüm numarası 3.1.2 olarak düzenlendi',
  ] },
  { s: '1.1.0', t: '2026-11-13', n: [
    'Kullanıcı girişi, roller (Yönetici / Yetkili / Personel / İzleyici) ve kayıt günlüğü (kim, ne zaman, ne yaptı)',
    'Personel ve izleyici rollerinde maliyet, kâr ve ciro bilgileri gizlenir',
    'Yedek konumu (klasör veya tek dosya) seçilmeli: seçilmezse, bulunamazsa veya izin düşerse uyarı verilir; yedeksiz kapatmada onay istenir',
    'Sürüm güncelleme bildirimi: yeni sürüm açılınca "neler yeni", eski dosyanın yeni veriyi bozması engellenir, GitHub\'dan yeni sürüm denetimi',

  { s: '1.0.0', t: '2026-11-12', n: ['İlk sürüm: stok, üretim, satış, zayiat, sayım fişi, takribi maliyet ve kâr, otomatik yedek.'] },
];
const surumKarsilastir = (a, b) => {
  const x = String(a || '0').split('.').map(Number), y = String(b || '0').split('.').map(Number);
  for (let i = 0; i < 3; i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0 ? 1 : -1; }
  return 0;
};
'use strict';
/* =====================================================================
   SOS STOK — tek dosya, çevrimdışı çalışır. Veri: tarayıcı (IndexedDB) +
   seçilen klasöre otomatik dosya yedeği.
   Akış:  ALIŞ → HAM | TİCARİ ;  ÜRETİM: HAM → MAMÜL (+yan ürün, fire) ;
          SATIŞ: MAMÜL | TİCARİ ;  ZAYİAT/İKRAM ;  SAYIM
   Maliyet: hareketli ağırlıklı ortalama. Satış fiyatı girilmezse
   ortalama maliyet × (1 + takribi kâr oranı) ile tahmin edilir.
   ===================================================================== */

// ============================ MOTOR BAŞLA ============================
const EPS = 1e-9;
const GRUPLAR = ['TICARI', 'HAM', 'MAMUL'];
const GRUP_AD = { TICARI: 'Ticari / Perakende', HAM: 'Ham madde', MAMUL: 'Mamül' };
const GRUP_KISA = { TICARI: 'Ticari', HAM: 'Ham', MAMUL: 'Mamül' };
const GRUP_IKON = { TICARI: '🛒', HAM: '🥩', MAMUL: '🏭' };
const TIP_AD = { ALIS: 'Alış', URETIM_GIRDI: 'Üretimde kullanılan', URETIM_CIKTI: 'Üretilen', YAN_URUN: 'Yan ürün',
  FIRE: 'Fire', SATIS: 'Satış', ZAYIAT: 'Zayiat / ikram', SAYIM: 'Sayım düzeltmesi' };
const ZAYIAT_NEDEN = ['Bozulma / son kullanma', 'Döküldü / kırıldı / düştü', 'Personel yemeği', 'İkram',
  'Numune / tadım', 'Hatalı üretim / yanık', 'Diğer'];
const SAYIM_NEDEN = ['Tartı / sayım farkı', 'Kayıt hatası (alış/satış girilmemiş)', 'Bozulma / zayiat (kayda geçmemiş)', 'Kayıp / bilinmiyor', 'Diğer'];
const IZAHAT_MIN = 20;
const BIRIMLER = ['KG', 'Adet', 'Litre', 'Paket', 'Koli', 'Metre', 'gram', 'ml', 'Ton'];

// ---------- biçimleme ----------
const nf2 = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf3 = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 3 });
const nf0 = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 0 });
const fmt = n => nf2.format(+n || 0);
const mikF = n => nf3.format(Math.abs(n) < 5e-10 ? 0 : (+n || 0));
const tl = n => nf2.format(+n || 0) + ' ₺';
const yuzde = n => (isFinite(n) ? nf2.format(n) : '—') + (isFinite(n) ? ' %' : '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const trLower = s => String(s ?? '').toLocaleLowerCase('tr');

/** "1.234,5", "1234,5", "12.5" -> sayı; boş/geçersiz -> NaN */
function sayiOku(s) {
  if (typeof s === 'number') return s;
  s = String(s ?? '').trim().replace(/\s/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const bugun = () => iso(new Date());
const gunEkle = (tarih, n) => { const d = new Date(tarih + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const trTarih = t => (t && t.length >= 10) ? `${t.slice(8, 10)}.${t.slice(5, 7)}.${t.slice(0, 4)}` : '';

// ---------- veri ----------
let db = bosDb();
let dv = 0;                       // veri sürümü (önbellek geçersiz kılma)
const memo = new Map();
/* ---------- roller ve yetkiler ---------- */
const ROLLER = {
  yonetici: { ad: 'Yönetici', izin: ['gor', 'giris', 'mali', 'duzelt', 'sayim', 'kart', 'ayar', 'kullanici', 'log'] },
  yetkili: { ad: 'Yetkili', izin: ['gor', 'giris', 'mali', 'duzelt', 'sayim', 'kart', 'log'] },
  personel: { ad: 'Personel', izin: ['gor', 'giris'] },
  izleyici: { ad: 'İzleyici', izin: ['gor'] },
};
const IZIN_AD = { gor: 'Stok durumu ve hareketleri görme', giris: 'Alış / Üretim / Satış / Zayiat girişi', mali: 'Maliyet, kâr ve ciro bilgilerini görme',
  duzelt: 'Hareket düzenleme / silme / geri alma, üretim ve sayım iptali', sayim: 'Stok sayımı', kart: 'Stok kartı yönetimi',
  ayar: 'Ayarlar, yedekleme, geri yükleme, veri silme', kullanici: 'Kullanıcı yönetimi', log: 'Kayıt günlüğünü görme' };
const LOG_MAX = 10000;
let oturum = null;                                   // { id, kadi, ad, rol } — kimlik.js yönetir
const authAktif = () => !!(db.guvenlik && db.guvenlik.aktif && db.kullanicilar.length);
/** Giriş koruması kapalıysa herkes her şeyi yapabilir; açıksa yalnızca rolün izinleri geçerlidir. */
const izin = p => !authAktif() || (!!oturum && !!ROLLER[oturum.rol] && ROLLER[oturum.rol].izin.includes(p));
const yasak = () => ({ ok: false, msg: 'Bu işlem için yetkiniz yok.' });
const aktifKadi = () => (oturum ? oturum.kadi : '');
function logYaz(islem, aciklama, ayr) {
  const e = { id: db.sayac++, ts: Date.now(), kadi: oturum ? oturum.kadi : '', ad: oturum ? oturum.ad : '', rol: oturum ? oturum.rol : '', islem, aciklama: String(aciklama || '') };
  if (ayr) e.ayr = ayr;
  db.log.push(e);

  const kod = kurtarmaKoduUret();
  const u = { id: db.sayac++, kadi, ad: String(ad).trim(), rol: 'yonetici', aktif: true, zorla: false, olusturma: Date.now(), sonGiris: Date.now(), sifre: await sifreKaydi(sifre) };
  db.kullanicilar.push(u);
  db.guvenlik = { aktif: true, kurtarma: await sifreKaydi(kodTemiz(kod)) };
  oturumKur(u); logYaz('KULLANICI', `Giriş koruması etkinleştirildi; ilk yönetici: ${kadi}`); degisti();
  return { ok: true, kod };
}
async function korumayiAc(kadi, sifre) {
  if (authAktif()) return { ok: false, msg: 'Koruma zaten açık.' };
  const u = db.kullanicilar.find(x => x.kadi === kadiTemiz(kadi) && x.rol === 'yonetici' && x.aktif !== false);
  if (!u || !(await sifreDogru(String(sifre || ''), u.sifre))) return { ok: false, msg: 'Yönetici kullanıcı adı veya şifresi hatalı.' };
  db.guvenlik.aktif = true; oturumKur(u); logYaz('KULLANICI', 'Giriş koruması yeniden açıldı'); degisti();
  return { ok: true };
}
async function korumayiKapat(sifre) {
  if (!izin('kullanici')) return yasak();
  const u = db.kullanicilar.find(x => x.id === oturum.id);
  if (!u || !(await sifreDogru(String(sifre || ''), u.sifre))) return { ok: false, msg: 'Şifre hatalı.' };
  logYaz('KULLANICI', 'Giriş koruması KAPATILDI (kullanıcı tanımları saklandı)'); db.guvenlik.aktif = false; degisti();
  return { ok: true };
}
async function kullaniciEkle({ kadi, ad, rol, sifre }) {
  if (!izin('kullanici')) return yasak();
  kadi = kadiTemiz(kadi);
  const h = kadiKontrol(kadi) || sifreKontrol(sifre) || (ROLLER[rol] ? '' : 'Rol seçin.') || (String(ad || '').trim() ? '' : 'Ad soyad boş olamaz.');
  if (h) return { ok: false, msg: h };
  db.kullanicilar.push({ id: db.sayac++, kadi, ad: String(ad).trim(), rol, aktif: true, zorla: true, olusturma: Date.now(), sonGiris: 0, sifre: await sifreKaydi(sifre) });
  logYaz('KULLANICI', `Kullanıcı eklendi: ${kadi} (${ROLLER[rol].ad})`); degisti();
  return { ok: true, msg: `${kadi} eklendi. İlk girişte şifresini değiştirmesi istenecek.` };
}
function kullaniciGuncelle(id, { ad, rol, aktif }) {
  if (!izin('kullanici')) return yasak();
  const u = db.kullanicilar.find(x => x.id === id); if (!u) return { ok: false, msg: 'Kullanıcı bulunamadı.' };
  const yeniRol = rol || u.rol, yeniAktif = aktif === undefined ? u.aktif !== false : !!aktif;
  if (!ROLLER[yeniRol]) return { ok: false, msg: 'Geçersiz rol.' };
  if ((u.rol === 'yonetici' && u.aktif !== false) && (yeniRol !== 'yonetici' || !yeniAktif) && aktifYoneticiSayisi(u.id) < 1)
    return { ok: false, msg: 'Son aktif yönetici pasifleştirilemez veya rolü düşürülemez.' };
  const d = [];
  if (ad && String(ad).trim() !== u.ad) { d.push(`ad ${u.ad} → ${String(ad).trim()}`); u.ad = String(ad).trim(); }
  if (yeniRol !== u.rol) { d.push(`rol ${ROLLER[u.rol].ad} → ${ROLLER[yeniRol].ad}`); u.rol = yeniRol; }
  if (yeniAktif !== (u.aktif !== false)) { d.push(yeniAktif ? 'aktif yapıldı' : 'pasif yapıldı'); u.aktif = yeniAktif; }
  if (!d.length) return { ok: true, msg: 'Değişiklik yok.' };
  logYaz('KULLANICI', `Kullanıcı güncellendi: ${u.kadi} — ${d.join(', ')}`); degisti();
  return { ok: true, msg: 'Kullanıcı güncellendi.' };
}
async function sifreSifirla(id, gecici) {
  if (!izin('kullanici')) return yasak();
  const u = db.kullanicilar.find(x => x.id === id); if (!u) return { ok: false, msg: 'Kullanıcı bulunamadı.' };
  const h = sifreKontrol(gecici); if (h) return { ok: false, msg: h };
  u.sifre = await sifreKaydi(gecici); u.zorla = true; denemeler.delete(u.kadi);
  logYaz('KULLANICI', `Şifre sıfırlandı (geçici): ${u.kadi}`); degisti();
  return { ok: true, msg: `${u.kadi} için geçici şifre belirlendi; ilk girişte değiştirmesi istenecek.` };
}
async function sifreDegistir(eski, yeni) {
  const u = oturum && db.kullanicilar.find(x => x.id === oturum.id); if (!u) return { ok: false, msg: 'Oturum yok.' };
  if (!(await sifreDogru(String(eski || ''), u.sifre))) return { ok: false, msg: 'Mevcut şifre hatalı.' };
  return sifreBelirle(yeni, eski);
}
/** Zorunlu şifre değişikliğinde (yönetici sıfırladıktan sonra ilk giriş) veya sifreDegistir içinden kullanılır. */
async function sifreBelirle(yeni, eski) {
  const u = oturum && db.kullanicilar.find(x => x.id === oturum.id); if (!u) return { ok: false, msg: 'Oturum yok.' };
  const h = sifreKontrol(yeni) || (yeni === eski ? 'Yeni şifre eskisiyle aynı olamaz.' : ''); if (h) return { ok: false, msg: h };
  u.sifre = await sifreKaydi(yeni); u.zorla = false; logYaz('KULLANICI', 'Kendi şifresini değiştirdi'); degisti();
  return { ok: true, msg: 'Şifre değiştirildi.' };
}
/** Yönetici şifresi unutulursa: ilk kurulumda gösterilen kurtarma koduyla yeni şifre belirlenir; yeni kod üretilir. */
async function kurtarmaIleSifirla(kod, kadi, yeni) {
  const d = denemeler.get('__kurtarma') || { n: 0, until: 0 };
  if (Date.now() < d.until) return { ok: false, msg: `Çok fazla hatalı deneme. ${Math.ceil((d.until - Date.now()) / 1000)} sn sonra tekrar deneyin.` };
  const u = db.kullanicilar.find(x => x.kadi === kadiTemiz(kadi) && x.rol === 'yonetici');
  const dogru = db.guvenlik && db.guvenlik.kurtarma && await sifreDogru(kodTemiz(kod), db.guvenlik.kurtarma);
  if (!u || !dogru) {
    d.n++; if (d.n >= 3) d.until = Date.now() + Math.min(900, 60 * Math.pow(2, d.n - 3)) * 1000; denemeler.set('__kurtarma', d);
    oturum = null; logYaz('GIRIS_HATA', `Hatalı kurtarma kodu denemesi (${kadiTemiz(kadi) || 'boş'})`); degisti();
    return { ok: false, msg: 'Kurtarma kodu veya yönetici kullanıcı adı hatalı.' };
  }
  const h = sifreKontrol(yeni); if (h) return { ok: false, msg: h };
  denemeler.delete('__kurtarma'); denemeler.delete(u.kadi);
  const yeniKod = kurtarmaKoduUret();
  u.sifre = await sifreKaydi(yeni); u.zorla = false; u.aktif = true; db.guvenlik.kurtarma = await sifreKaydi(kodTemiz(yeniKod));
  oturum = null; logYaz('KULLANICI', `Yönetici şifresi kurtarma koduyla sıfırlandı: ${u.kadi}`); degisti();
  return { ok: true, kod: yeniKod };
}

// ============================ DEPO BAŞLA ============================
/* Katmanlar (hepsi her değişiklikte, ~0,4 sn sonra):
   1) IndexedDB ana kayıt   2) localStorage senkron kopya   3) IndexedDB döner anlık görüntüler
   4) SEÇİLEN YEDEK KONUMU (Chrome/Edge):
        • klasör  → stok_portal_guncel.json (her değişiklik), gunluk_*.json, anlik_*.json (saatlik), oncesi_*.json
        • tek dosya → seçilen .json dosyası her değişiklikte üzerine yazılır
   Konum seçilmemişse / bulunamazsa / izin düşerse veri tarayıcıda tutulmaya devam eder ve kullanıcı uyarılır;
   konum geri gelince (sürücü takılınca vb.) otomatik yeniden bağlanılır ve güncel yedek yazılır.            */
const Depo = {
  db: null, ok: false, hata: '',
  async ac() {
    if (typeof indexedDB === 'undefined') throw new Error('IndexedDB desteklenmiyor');
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('sos_stok_v1', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        if (!d.objectStoreNames.contains('snap')) d.createObjectStore('snap', { keyPath: 'ts' });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('Veritabanı başka sekme tarafından kilitli'));
    });
    this.ok = true;
  },
  p(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); },
  st(ad, mod) { return this.db.transaction(ad, mod).objectStore(ad); },
  kvAl(k) { return this.p(this.st('kv', 'readonly').get(k)); },
  kvKoy(k, v) { return this.p(this.st('kv', 'readwrite').put(v, k)); },
  snapKoy(ts, json, etiket) { return this.p(this.st('snap', 'readwrite').put({ ts, json, etiket, boyut: json.length })); },
  snapListe() { return this.p(this.st('snap', 'readonly').getAll()).then(l => l.sort((a, b) => b.ts - a.ts)); },
  snapSil(ts) { return this.p(this.st('snap', 'readwrite').delete(ts)); },
  async snapTemizle(tut) { const l = await this.snapListe(); for (const x of l.slice(tut)) await this.snapSil(x.ts); },
};

const Klasor = {
  destek: typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function',
  dosyaDestek: typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function',
  h: null, tur: '', durum: 'yok', ad: '', hata: '', sonYazma: 0, _anlik: 0, _gunluk: 0,
  // durum: yok (seçilmedi) | tamam | izin (tarayıcı izni gerekiyor) | kayip (konum bulunamadı) | hata
  get secilebilir() { return this.destek || this.dosyaDestek; },
  async baslat() {
    if (!this.secilebilir || !Depo.ok) return;
    try { this.h = (await Depo.kvAl('dir')) || null; this.sonYazma = (await Depo.kvAl('sonYazma')) || 0; } catch (e) { this.h = null; }
    if (this.h) { this.tur = this.h.kind === 'file' ? 'dosya' : 'klasor'; this.ad = this.h.name; await this.kontrol(); }
  },
  /** İzin var mı ve konum gerçekten duruyor mu? (klasör silindi/taşındı/sürücü çıkarıldı ise 'kayip') */
  async kontrol() {
    if (!this.h) { this.durum = 'yok'; return; }
    try { if ((await this.h.queryPermission({ mode: 'readwrite' })) !== 'granted') { this.durum = 'izin'; return; } }
    catch (e) { this.durum = 'hata'; this.hata = String(e.message || e); return; }
    try { await this.varMi(); this.durum = 'tamam'; this.hata = ''; }
    catch (e) {
      if (e && e.name === 'NotFoundError') { this.durum = 'kayip'; this.hata = 'Yedek konumu bulunamadı (silinmiş, taşınmış veya sürücü takılı değil).'; }
      else { this.durum = 'hata'; this.hata = String((e && e.message) || e); }
    }
  },
  async varMi() { if (this.tur === 'dosya') await this.h.getFile(); else for await (const x of this.h.entries()) { void x; break; } },
  async _sakla(h, tur) { this.h = h; this.tur = tur; this.ad = h.name; this.durum = 'tamam'; this.hata = ''; await Depo.kvKoy('dir', h); },
  async sec() { await this._sakla(await window.showDirectoryPicker({ mode: 'readwrite', id: 'sosstok' }), 'klasor'); },
  async dosyaSec() {
    await this._sakla(await window.showSaveFilePicker({ suggestedName: 'stok_portal_yedek.json', types: [{ description: 'Stok Portal yedeği', accept: { 'application/json': ['.json'] } }] }), 'dosya');
  },
  async izinVer() {
    try { await this.h.requestPermission({ mode: 'readwrite' }); } catch (e) { this.hata = String(e.message || e); }
    await this.kontrol();
  },
  async dosyaYaz(ad, metin) {
    const h = this.tur === 'dosya' ? this.h : await this.h.getFileHandle(ad, { create: true });
    const w = await h.createWritable();           // atomik: kapanışta yer değiştirir
    await w.write(metin); await w.close();
  },
  async listele() {
    if (this.tur === 'dosya') { const f = await this.h.getFile(); return [{ ad: this.h.name, boyut: f.size, degisim: f.lastModified }]; }
    const out = [];
    for await (const [ad, h] of this.h.entries()) {
      if (h.kind === 'file' && /^(stok_portal|anlik|gunluk|oncesi).*\.json$/.test(ad)) { const f = await h.getFile(); out.push({ ad, boyut: f.size, degisim: f.lastModified }); }
    }
    return out.sort((a, b) => b.degisim - a.degisim);
  },
  async oku(ad) { return (await (this.tur === 'dosya' ? this.h : await this.h.getFileHandle(ad)).getFile()).text(); },
  async temizle(onek, tut) {
    const l = (await this.listele()).filter(x => x.ad.startsWith(onek));
    for (const x of l.slice(tut)) { try { await this.h.removeEntry(x.ad); } catch (e) { /* yoksay */ } }
  },
  async yaz(json, zorla, kapanis) {
    if (this.durum !== 'tamam') return false;
    try {
      if (this.tur === 'dosya') await this.dosyaYaz(null, json);
      else {
        const d = new Date(), gun = iso(d).replace(/-/g, ''), hm = String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
        await this.dosyaYaz('stok_portal_guncel.json', json);
        if (zorla || Date.now() - this._gunluk > 5 * 60e3) { await this.dosyaYaz(`gunluk_${gun}.json`, json); this._gunluk = Date.now(); await this.temizle('gunluk_', 90); }
        if (zorla || Date.now() - this._anlik > (kapanis ? 10 : 60) * 60e3) { await this.dosyaYaz(`anlik_${gun}_${hm}.json`, json); this._anlik = Date.now(); await this.temizle('anlik_', 48); }
      }
      this.sonYazma = Date.now(); this.hata = '';
      try { if (Depo.ok) await Depo.kvKoy('sonYazma', this.sonYazma); } catch (e) { /* yoksay */ }
      return true;
    } catch (e) {
      this.hata = String((e && e.message) || e);
      if (e && e.name === 'NotFoundError') { this.durum = 'kayip'; this.hata = 'Yedek konumu bulunamadı (silinmiş, taşınmış veya sürücü takılı değil).'; }
      else this.durum = (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) ? 'izin' : 'hata';
      return false;
    }
  },
};

const Kayit = {
  bekleyen: false, zaman: null, kuyruk: Promise.resolve(), sonKayit: 0, sonSnap: 0, eskiSekme: false, hata: '', sonIndirme: 0, kirli: false,
  planla() {
    if (this.eskiSekme || db._yeni) return;
    this.bekleyen = true; this.kirli = true; durumGuncelle();
    clearTimeout(this.zaman);
    this.zaman = setTimeout(() => this.flush(), 400);
  },
  flush(neden) { this.kuyruk = this.kuyruk.then(() => this._flush(neden)).catch(() => {}); return this.kuyruk; },
  senkron() {                                   // sayfa kapanırken: senkron kopya (eski/yeni-biçim sekme asla yazmaz)
    if (this.eskiSekme || db._yeni) return;
    try { localStorage.setItem('sos_db', JSON.stringify(db)); } catch (e) { /* yoksay */ }
  },
  async _flush(neden) {
    if (this.eskiSekme || db._yeni || (!this.bekleyen && neden !== 'zorla')) return;
    this.bekleyen = false;
    db.gun = Date.now();
    const json = JSON.stringify(db);
    let hata = '';
    try { localStorage.setItem('sos_db', json); } catch (e) { /* kota: IDB yeterli */ }
    if (Depo.ok) {
      try {
        await Depo.kvKoy('db', json);
        if (neden === 'zorla' || Date.now() - this.sonSnap > 10 * 60e3) {
          await Depo.snapKoy(Date.now(), json, neden === 'zorla' ? 'Elle' : 'Otomatik'); this.sonSnap = Date.now();
          await Depo.snapTemizle(30);
        }
      } catch (e) { hata = 'Tarayıcı kaydı yazılamadı: ' + (e.message || e); }
    } else hata = 'Tarayıcı veritabanı yok; yalnızca yedek konumu/dosya yedeği geçerli.';
    if (Klasor.durum === 'tamam') { if (await Klasor.yaz(json, neden === 'zorla', neden === 'kapanis')) this.kirli = false; }
    this.hata = hata; this.sonKayit = Date.now();
    try { if (bc) bc.postMessage({ gun: db.gun }); } catch (e) { /* yoksay */ }
    durumGuncelle(); bannerGuncelle();
  },
  async oncesi(etiket) {                        // riskli işlemden (içe aktarma, sıfırlama, sürüm yükseltme) önce görüntü
    const json = JSON.stringify(db), d = new Date();
    try { if (Depo.ok) { await Depo.snapKoy(Date.now(), json, etiket); await Depo.snapTemizle(30); } } catch (e) { /* yoksay */ }
    if (Klasor.durum === 'tamam' && Klasor.tur === 'klasor') { try { await Klasor.dosyaYaz(`oncesi_${iso(d).replace(/-/g, '')}_${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}${String(d.getSeconds()).padStart(2, '0')}.json`, json); await Klasor.temizle('oncesi_', 20); } catch (e) { /* yoksay */ } }
  },
  indirildi() { this.sonIndirme = Date.now(); this.kirli = false; try { if (Depo.ok) Depo.kvKoy('sonIndirme', this.sonIndirme); } catch (e) { /* yoksay */ } },
  /** Yedek güvencesi: seviye ok | uyari | hata. 'hata' = veri yalnızca tarayıcıda, kullanıcı uyarılmalı. */
  yedekDurumu() {
    const veri = db.hr.length + db.kartlar.length > 0;
    if (Klasor.durum === 'tamam') return { kod: 'tamam', seviye: 'ok' };
    if (!Klasor.secilebilir) return { kod: 'desteklenmiyor', seviye: veri ? 'hata' : 'uyari' };
    if (Klasor.durum === 'kayip') return { kod: 'kayip', seviye: 'hata' };
    if (Klasor.durum === 'hata') return { kod: 'hata', seviye: 'hata' };
    if (Klasor.durum === 'izin') return { kod: 'izin', seviye: 'uyari' };
    return { kod: 'yok', seviye: veri ? 'hata' : 'uyari' };
  },
  /** Sekme kapanırken: kaydedilmemiş (yedeksiz) değişiklik var mı? */
  yedeksizKapanis() { return !db._yeni && this.kirli && this.yedekDurumu().seviye !== 'ok' && db.hr.length + db.kartlar.length > 0; },
};
kaydetKancasi = () => Kayit.planla();

const bc = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('sos_stok_v1') : null;
if (bc) bc.onmessage = e => { if (e.data && e.data.gun > db.gun) { Kayit.eskiSekme = true; bannerGuncelle(); durumGuncelle(); } };

/** Takılabilecek tarayıcı çağrılarının uygulamayı sonsuza dek "Yükleniyor"da bırakmasını önler. */
const zamanAsimi = (p, ms, ad) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error((ad || 'İşlem') + ' zaman aşımına uğradı')), ms))]);
async function yukle() {
  let a = null, b = null;
  try { await zamanAsimi(Depo.ac(), 6000, 'Tarayıcı veritabanı'); const s = await Depo.kvAl('db'); if (s) a = JSON.parse(s); Kayit.sonIndirme = (await Depo.kvAl('sonIndirme')) || 0; } catch (e) { Depo.hata = String(e.message || e); }
  try { const s = localStorage.getItem('sos_db'); if (s) b = JSON.parse(s); } catch (e) { /* yoksay */ }
  const adaylar = [a, b].filter(x => x && dogrula(x)).sort((x, y) => (y.gun || 0) - (x.gun || 0));
  db = adaylar[0] || bosDb();
  dv++; memo.clear();
  try { await zamanAsimi(Klasor.baslat(), 6000, 'Yedek konumu denetimi'); } catch (e) { Klasor.hata = String(e.message || e); }
  try { if (navigator.storage && navigator.storage.persist) await zamanAsimi(navigator.storage.persist(), 3000, 'Kalıcı depolama isteği'); } catch (e) { /* yoksay */ }
}

function dosyaIndir(ad, metin, mime) {
  const blob = new Blob([metin], { type: mime || 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = ad;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const zamanDamga = () => { const d = new Date(); return iso(d).replace(/-/g, '') + '_' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0'); };

/** Yedek metnini doğrular ve özetler (uygulamadan önce onay penceresi için). */
function yedekCoz(metin) {
  let o; try { o = JSON.parse(metin); } catch (e) { return { hata: 'Dosya geçerli bir JSON değil.' }; }
  if (!dogrula(o)) return { hata: 'Bu dosya bir Stok Portal yedeği değil.' };
  if (o._yeni) return { hata: `Bu yedek daha yeni bir sürümle alınmış (veri biçimi v${o.v}); bu dosya v${DB_SEMA}'yi destekliyor. Güncel index.html ile açın.` };
  return { o, kart: o.kartlar.length, hr: o.hr.length, gun: o.gun, firma: o.firma, surum: o.app || '—' };
}
async function yedekUygula(o, etiket) {

SAYFA.stok = () => {

  if (S.donem === 'bugun') { bas = bit = bu; } else if (S.donem === 'hafta') { bas = gunEkle(bu, -6); bit = bu; } else if (S.donem === 'ay') { bas = bu.slice(0, 8) + '01'; bit = bu; }

  const ust = baslik('📦', 'Stok durumu', 'Devir + Gelen − Giden = Kalan. Maliyet ve takribi satış değeriyle birlikte.');
  if (!db.kartlar.length) return ust + bos('Henüz stok kartı yok. <b>Kartlar</b> sayfasından ekleyin.');
  const d = defter(bas, bit);
  const liste = kartlarSirali().map(k => d.get(k.id)).filter(x => !S.gizle || [x.devir, x.gelen, x.satilan, x.kullanilan, x.diger, x.kalan].some(v => Math.abs(v) > 0.0009))

  const donemSec = `<div class="satir"><label>Dönem<select data-set="stok.donem">${secenek([['bugun', 'Bugün'], ['hafta', 'Son 7 gün'], ['ay', 'Bu ay'], ['tum', 'Tümü'], ['aralik', 'Tarih aralığı']], S.donem)}</select></label>
${S.donem === 'aralik' ? `<label>Başlangıç<input type="date" data-set="stok.bas" value="${bas}"></label><label>Bitiş<input type="date" data-set="stok.bit" value="${bit}"></label>` : ''}
<label class="ara">Ara<input id="ara-st" data-filtre="st" placeholder="Ürün ara…" autocomplete="off"></label>

<button class="btn" data-act="csv-stok">⬇ Excel (CSV)</button></div>`;
  const sd = stokDegerleri();
  const kpis = `<div class="grid g4">${GRUPLAR.map(g => kpi(`${GRUP_IKON[g]} ${GRUP_AD[g]}`, `${sd[g].n} kalem stokta`, (izin('mali') ? `Değer ${tl(sd[g].deger)}${g !== 'HAM' ? ` · takribi satış ${tl(sd[g].takribi)}` : ''}` : ''))).join('')}${kpi('⚠️ Dikkat', uyarilar().length + ' kart', 'asgari altı veya eksi stok')}</div>`;
  const tabId = aktifSekme('st', 'TICARI');
  const sek = sekmeler('st', [['TICARI', `${GRUP_IKON.TICARI} Ticari`], ['HAM', `${GRUP_IKON.HAM} Ham`], ['MAMUL', `${GRUP_IKON.MAMUL} Mamül`], ['TUM', '📋 Tümü'], ['SIP', '🛍️ Sipariş listesi']]);
  let govde;
  if (tabId === 'SIP') {
    const sp = siparisListesi();
    govde = sp.length ? tablo([{ b: 'Ürün', f: r => kartEtiket(r.kart) }, { b: 'Grup', f: r => GRUP_KISA[r.kart.grup] }, { b: 'Birim', f: r => esc(r.kart.birim) },
      { b: 'Mevcut', c: 'sag', f: r => mikF(r.kalan) }, { b: 'Asgari', c: 'sag', f: r => mikF(r.asgari) }, { b: 'Önerilen miktar', c: 'sag kalin', f: r => mikF(r.oner) },
      { b: 'Son ort. maliyet', c: 'sag', f: r => r.ort > 0 ? tl(r.ort) : '—' }, { b: 'Tahmini tutar', c: 'sag', f: r => r.ort > 0 ? tl(r.tutar) : '—' }], sp,
      { alt: `<tr><td colspan="7" class="sag kalin">Tahmini toplam (satın alınacaklar)</td><td class="sag kalin">${tl(sp.filter(r => r.kart.grup !== 'MAMUL').reduce((a, r) => a + r.tutar, 0))}</td></tr>` }) +
      '<p class="mut kucuk">Asgari stoğu olan kartlardan, stoğu asgariye eşit/altına inenler. Önerilen miktar = stoğu asgarinin 2 katına tamamlamak için gereken. Asgari stok Kartlar sayfasından girilir. Mamül için "önerilen" üretilecek miktardır.</p>'

    if (tabId !== 'HAM' || varMi(x => x.satilan)) kol.push({ b: 'Satılan', c: 'sag', f: x => mikF(x.satilan) });

function liveSayim() {

  document.querySelectorAll('#tb-sy tbody tr').forEach(tr => {

        f.textContent = (fark > 0 ? '+' : '') + mikF(fark); f.className = 'sag ' + (fark > 0 ? 'g' : 'c'); dg.textContent = tl(fark * ort); ne.hidden = false;
        tr.classList.toggle('fz', net > 0 && Math.abs(fark) / net >= 0.1);

    } else { f.textContent = ''; f.className = 'sag'; dg.textContent = ''; ne.hidden = true; tr.classList.remove('fz'); }
  });

<label>İşlem<select data-set="log.islem">${secenek([['', 'Tümü'], ...Object.entries(LOG_AD)], L.islem)}</select></label>

    { b: 'İşlem', f: l => chip(LOG_AD[l.islem] || l.islem, ['GIRIS_HATA', 'SIL'].includes(l.islem) ? 'wr' : '') }, { b: 'Açıklama', f: l => esc(l.aciklama) }], rows.slice(0, 500),
    { id: 'tb-lg', attr: l => `data-ad="${esc(trLower(l.aciklama + ' ' + l.kadi + ' ' + (LOG_AD[l.islem] || l.islem)))}" data-grup="all"` }) +
    (rows.length > 500 ? `<p class="mut kucuk">En yeni 500 satır gösteriliyor (${rows.length}). Süzgeçleri daraltın veya CSV'ye aktarın.</p>` : '') : bos('Bu süzgeçle günlük kaydı yok.')}
<p class="mut kucuk">Günlük en fazla ${nf0.format(LOG_MAX)} satır tutulur${db.logKirpilan ? ` (şimdiye kadar ${nf0.format(db.logKirpilan)} eski satır kırpıldı)` : ''}. Günlük uygulama içinde silinemez; yedekler günlüğü de içerir. Günlük bir işlem takip kaydıdır; teknik olarak yedek dosyası düzenlenerek değiştirilebileceği için hukuki/güvenlik kanıtı olarak görülmemelidir.</p></div>`;
}

async function yedekListesiDoldur() {
  const el = $('yedek-liste'); if (!el) return;
  let html = '';
  try {
    if (Klasor.durum === 'tamam') {
      const l = await Klasor.listele();
      for (const x of l.slice(0, 15)) { try { const c = yedekCoz(await Klasor.oku(x.ad)); x.ic = c.hata ? '—' : `${c.kart} kart · ${c.hr} hareket`; } catch (e) { x.ic = '—'; } }
      html += `<h4>${Klasor.tur === 'dosya' ? '📄 Yedek dosyası' : '📁 Klasördeki yedekler'}</h4>${l.length ? tablo([{ b: 'Dosya', f: x => esc(x.ad) }, { b: 'Tarih', f: x => new Date(x.degisim).toLocaleString('tr-TR') }, { b: 'İçerik', f: x => esc(x.ic || '—') }, { b: 'Boyut', c: 'sag', f: x => nf0.format(x.boyut / 1024) + ' KB' },
        { b: '', f: x => `<button class="btn kucuk" data-act="yedek-klasor-yukle" data-id="${esc(x.ad)}">Geri yükle</button>` }], l.slice(0, 40)) : '<p class="mut">Konumda yedek yok.</p>'}`;
    }
    if (Depo.ok) {
      const l = await Depo.snapListe();
      html += `<h4>🌐 Tarayıcı içi anlık görüntüler</h4>${l.length ? tablo([{ b: 'Zaman', f: x => new Date(x.ts).toLocaleString('tr-TR') }, { b: 'Tür', f: x => esc(x.etiket) }, { b: 'İçerik', f: x => { try { const c = yedekCoz(x.json); return c.hata ? '—' : `${c.kart} kart · ${c.hr} hareket`; } catch (e) { return '—'; } } }, { b: 'Boyut', c: 'sag', f: x => nf0.format(x.boyut / 1024) + ' KB' },
        { b: '', f: x => `<button class="btn kucuk" data-act="yedek-snap-yukle" data-id="${x.ts}">Geri yükle</button>` }], l.slice(0, 30)) : '<p class="mut">Henüz görüntü yok (ilk değişiklikten sonra oluşur).</p>'}`;
    }
  } catch (e) { html += `<p class="mut">Liste okunamadı: ${esc(e.message || e)}</p>`; }
  el.innerHTML = html || '<p class="mut">Yedek listesi için yedek konumu seçin.</p>';
}

function durumGuncelle() {
  const el = $('kayit-durum'); if (!el) return;
  let t, k = 'ok';
  const y = Kayit.yedekDurumu();
  if (db._yeni) { t = '⛔ Salt okunur'; k = 'er'; }
  else if (Kayit.eskiSekme) { t = '⚠️ Başka sekmede değişti'; k = 'er'; }
  else if (Kayit.bekleyen) { t = '⏳ Kaydediliyor…'; k = 'wr'; }
  else {
    const z = Kayit.sonKayit || db.gun; const s = z ? new Date(z).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '';
    t = '💾 Kaydedildi' + (s ? ' ' + s : '');
    if (y.kod === 'tamam') t += ` · ${Klasor.tur === 'dosya' ? '📄' : '📁'} yedek ✓`;
    else { t += y.kod === 'kayip' ? ' · ⚠ yedek konumu yok' : ' · ⚠ yedek yok'; k = y.seviye === 'hata' ? 'er' : 'wr'; }
    if (Kayit.hata) k = 'er';
  }
  el.textContent = t; el.className = 'durum ' + k; el.title = Kayit.hata || Klasor.hata || '';
  const ky = $('kul'); if (ky) { if (authAktif() && oturum) { ky.hidden = false; ky.textContent = `👤 ${oturum.ad} · ${ROLLER[oturum.rol] ? ROLLER[oturum.rol].ad : ''}`; } else ky.hidden = true; }
}

function bildir(msg, tur) {
  const t = $('toast'); if (!t) return;
  const e = document.createElement('div'); e.className = 'ti ' + (tur || 'ok'); e.textContent = msg; t.appendChild(e);
  setTimeout(() => e.classList.add('go'), 20); setTimeout(() => e.remove(), tur === 'er' ? 7000 : 3800);
}

const MALI_BASLIK = ['Ort. maliyet', 'Son ort. maliyet', 'Stok değeri', 'Takribi satış değeri', 'Birim maliyet', 'Satış fiyatı', 'Değer', 'Girdi maliyeti', 'Tahmini tutar', 'Değer (maliyet)'];
const MALI_TABLO = { 'tb-al': ['Ort. maliyet', 'Birim fiyat (₺)', 'Tutar'], 'tb-sa': ['Ort. maliyet', 'Takribi fiyat'], 'tb-za': ['Ort. maliyet', 'Kayıp değeri'] };
function maskele() {
  if (izin('mali')) return;
  document.querySelectorAll('#app table.tbl').forEach(t => {
    const liste = (t.id && MALI_TABLO[t.id]) || MALI_BASLIK;
    t.querySelectorAll('tfoot').forEach(f => f.remove());
    const idx = []; [...t.querySelectorAll('thead th')].forEach((th, i) => { if (liste.includes(th.textContent.trim())) idx.push(i); });
    if (!idx.length) return;
    t.querySelectorAll('tr').forEach(tr => { const c = [...tr.children].filter(x => x.tagName); idx.slice().reverse().forEach(i => { if (c[i]) c[i].remove(); }); });
  });
}

  el.innerHTML = '<div class="card" style="max-width:640px;margin:30px auto"><h3>⚠️ Uygulama başlatılamadı</h3><p>Verileriniz silinmedi. Sayfayı <b>Ctrl+F5</b> ile yenileyin; sürerse aşağıdaki hata satırını geliştiriciye iletin.</p><pre style="white-space:pre-wrap;background:#f4f4f6;padding:10px;border-radius:6px">' + esc(String((e && (e.stack || e.message)) || e)).slice(0, 800) + '</pre><p class="mut kucuk">Sürüm ' + esc(typeof SURUM !== 'undefined' ? SURUM : '?') + '</p></div>';
}
async function baslat() {
  // Web uygulaması olarak yüklenebilirlik + çevrimdışı açılış (yalnızca http/https'te; dosyadan açılışta yoktur)
  try { if (typeof navigator !== 'undefined' && navigator.serviceWorker && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* yoksay */ }
  olaylariBagla();
  await yukle();
  ui.sonEtkinlik = Date.now();
  if (db._yeni) { render(); return; }
  if (db.app && surumKarsilastir(SURUM, db.app) > 0) {
    ui.surumNotu = { eski: db.app, yeni: SURUM };
    await Kayit.oncesi(`Sürüm güncellemesi öncesi (${db.app} → ${SURUM})`);
    const e = db.app; db.app = SURUM; logYaz('SURUM', `Uygulama güncellendi: ${e} → ${SURUM}`); degisti();
  } else if (db.app && surumKarsilastir(SURUM, db.app) < 0) ui.eskiDosya = db.app;
  else if (!db.app) db.app = SURUM;
  ui.sayfa = (location.hash || '#panel').slice(1);
  if (authAktif()) {
    if (!oturumGeriYukle()) { kilitGoster('giris'); }
    else { const u = db.kullanicilar.find(x => x.id === oturum.id); if (u && u.zorla) kilitGoster('zorla'); else girisSonrasi(); }
  } else girisSonrasi();
  try { if (!sessionStorage.getItem('sos_sk')) { sessionStorage.setItem('sos_sk', '1'); guncellemeKontrol().then(() => { bannerGuncelle(); }); } } catch (e) { /* yoksay */ }
}

// ============================ ARAYÜZ BİTİŞ ============================
if (typeof document !== 'undefined' && document.getElementById && document.getElementById('app')) baslat().catch(baslatHatasi);
globalThis.SOS = { SAYFA, ui, ACT, periyodikKontrol, yedekMesaj, maskele, render, get db() { return db; }, set db(v) { db = v; } };
</script>
