.anahtar{font:700 19px/1.3 ui-monospace,Consolas,monospace;letter-spacing:1.5px;text-align:center;background:var(--pri2);color:var(--ink);border-radius:10px;padding:14px 8px;user-select:all;word-break:break-all}
.rolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ibtn{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--pri);background:var(--card);color:var(--pri);font:italic 700 13px/1 Georgia,'Times New Roman',serif;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:hover{background:var(--pri);color:#fff}
#view td a,#view .card a:not(.btn),#view .mut a,#view .warn a{color:var(--pri);text-decoration:none;font-weight:600}
#view td a:hover,#view .card a:not(.btn):hover,#view .mut a:hover{text-decoration:underline}
td:has(>.btn),td:has(>.act){white-space:nowrap}
td .btn.sm{padding:3px 8px;font-size:calc(12px*var(--z))}
.act{display:inline-flex;gap:3px;justify-content:flex-end;white-space:nowrap;min-width:0}.act .btn{margin:0}
td:has(>.act){padding-left:4px;padding-right:6px}
.ptop{display:flex;align-items:center;gap:8px;margin:0 0 8px}.ptop .sp{flex:1}
.tw table.swc{table-layout:fixed}
.stb{display:flex;justify-content:flex-end;margin:0 0 4px}.sut{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 12px}
.tw table.swc th,.tw table.swc td{overflow:hidden;text-overflow:ellipsis}
.tw table.swc th{white-space:nowrap}
.tw table.swc .fl{padding:0;border-left:0;overflow:hidden}.tw table.swc th.fl{background:var(--bg)}
.tw th{position:sticky}
th .rz{position:absolute;top:0;right:0;bottom:0;width:7px;cursor:col-resize;user-select:none;touch-action:none}
th .rz::after{content:'';position:absolute;top:22%;bottom:22%;right:3px;width:1px;background:var(--line)}
th:hover .rz::after,th .rz.on::after{background:var(--pri);width:2px;right:2px}

.btn.ic{padding:3px 0;min-width:28px;text-align:center;font-weight:600}
.btn.ic:not(.red){border-color:transparent;background:transparent;color:var(--mut)}
.btn.ic:not(.red):hover{background:var(--pri2);color:var(--pri)}
.btn.ic.red{border-color:transparent;background:transparent}
.btn.ic.red:hover{background:#fbe3e0}
.ozet{color:var(--mut);font-size:calc(13px*var(--z));white-space:nowrap}
@media(max-width:860px){.ozet{white-space:normal;flex-basis:100%}}.ozet b{color:var(--ink)}.ozet b.neg{color:var(--red)}
.hkm{position:fixed;z-index:9999;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.22);padding:4px;min-width:220px}.hkm .hkh{padding:6px 10px;font-weight:700;font-size:calc(12px*var(--z));color:var(--mut);border-bottom:1px solid var(--line);margin-bottom:2px}.hkm button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink);font:inherit}.hkm button:hover,.hkm button:focus{background:var(--pri2);outline:0}tr[data-hk]{cursor:pointer}tr[data-hk]:hover td{background:var(--pri2)}@media print{.hkip{display:none}}
.mtabs{display:flex;gap:2px;margin:0 0 14px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.mtabs a{cursor:pointer;padding:9px 16px;font-weight:600;font-size:calc(14px*var(--z));color:var(--mut);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-2px}
.mtabs a:hover{color:var(--pri)}.mtabs a.on{color:var(--pri);border-bottom-color:var(--pri)}
.seg{display:inline-flex;border:1px solid var(--pri);border-radius:9px;overflow:hidden;margin:0 0 12px}
.seg a{padding:6px 14px;font-size:calc(13px*var(--z));font-weight:600;color:var(--pri);cursor:pointer;text-decoration:none}.seg a.on{background:var(--pri);color:#fff}
.chk-l{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:calc(13.5px*var(--z))}.chk-l:last-child{border-bottom:0}.chk-l b.ok{color:var(--grn)}.chk-l b.uy{color:var(--amb)}
.pdoc{font-family:Arial,sans-serif;color:#000;font-size:calc(12px*var(--z))}
.pdoc .ph{display:flex;justify-content:space-between;margin-bottom:18px;gap:20px}
.pdoc h1{font-size:calc(22px*var(--z));margin:0 0 6px}.pdoc h2{font-size:calc(16px*var(--z));margin:0 0 4px}
.pdoc table{border:1px solid #999}.pdoc th{background:#eee;color:#000;position:static}.pdoc td,.pdoc th{border:1px solid #bbb;padding:5px 7px}

@media(max-width:860px){#app{grid-template-columns:1fr}#side{position:fixed;left:-260px;width:250px;z-index:30;transition:left .2s}#app.menu #side{left:0}#top .burger{display:inline-flex}#view{padding:14px 12px 60px}}

/* ===== v1.8 görünüm: düğmeler, sekmeler, temalar, üst menü ===== */
.btn{border-color:color-mix(in srgb,var(--pri) 40%,var(--line));color:var(--pri);font-weight:600;box-shadow:0 1px 1px rgba(16,24,40,.08);transition:background .12s,box-shadow .12s,border-color .12s}

.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.pri:hover{background:color-mix(in srgb,var(--pri) 86%,#000);color:#fff}
.btn.red{color:var(--red);border-color:color-mix(in srgb,var(--red) 42%,var(--line))}

.btn.ghost:hover{background:var(--pri2)}
.btn.sm{font-weight:600}
.tabs a{border-color:color-mix(in srgb,var(--pri) 40%,var(--line));color:var(--pri);font-weight:600;box-shadow:0 1px 1px rgba(16,24,40,.08);user-select:none;transition:background .12s}
.tabs a:hover{background:var(--pri2);border-color:var(--pri)}
.tabs a.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.note{border-left:4px solid var(--pri);border-radius:6px 9px 9px 6px;color:var(--ink)}
.fg.al{align-items:end}
.fg label.chk{padding-bottom:9px}

async function kvSet(k,v){const db=await idbOpen();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

function yeniDurum(){return{v:1,sema:DB_SEMA,appVer:APP_VER,firma:{ad:'',vkn:'',vd:'',adres:'',tel:'',email:'',iban:'',logo:''},

function uyumla(d){const b=yeniDurum();for(const k of Object.keys(b)){if(d[k]===undefined)d[k]=b[k]}for(const k of Object.keys(b.ayar)){if(d.ayar[k]===undefined)d.ayar[k]=b.ayar[k]}for(const k of Object.keys(b.firma)){if(d.firma[k]===undefined)d.firma[k]=b.firma[k]}if(d.hesaplar.length)baslikTamamla(d.hesaplar);if(!d.cariGruplari.length)d.cariGruplari=varsayilanGruplar();d.cariler.forEach(c=>{if(!c.grupId)c.grupId={musteri:'g_musteri',tedarikci:'g_tedarikci',ikisi:'g_ikisi'}[c.tur]||'g_musteri'});return d}

/* ---------------- Hesap planı ve yevmiye çekirdeği ---------------- */
let _bm=null;
const hesapBul=k=>S.hesaplar.find(h=>h.kod===k);
function hesapEkle(kod,ad,grup){if(!hesapBul(kod))S.hesaplar.push({kod,ad,grup:grup||grupTahmin(kod)});return kod}
function yeniAltHesap(ana,ad,hane=2){
  const pre=ana+'.';const n=Math.max(0,...S.hesaplar.filter(h=>h.kod.startsWith(pre)&&/^\d+$/.test(h.kod.slice(pre.length))).map(h=>parseInt(h.kod.slice(pre.length),10)))+1;
  const kod=pre+pad(n,hane);hesapEkle(kod,ad,(hesapBul(ana)||{}).grup||grupTahmin(ana));return kod;
}
function kdvHesap(ana,oran){const kod=ana+'.'+pad(Math.round(oran));return hesapEkle(kod,(ana==='391'?'Hesaplanan KDV %':'İndirilecek KDV %')+oran,ana==='391'?'pasif':'aktif')}
function sonrakiNo(tip,pre){S.ayar.sayac[tip]=(S.ayar.sayac[tip]||0)+1;return pre+'-'+new Date().getFullYear()+'-'+pad(S.ayar.sayac[tip],5)}
function fisYaz({tarih,aciklama,kaynak,satirlar}){
  kilitKontrol(tarih);
  const L=satirlar.filter(s=>r2(s.borc)||r2(s.alacak)).map(s=>({hesap:s.hesap,borc:r2(s.borc),alacak:r2(s.alacak),aciklama:s.aciklama||''}));
  const b=r2(L.reduce((t,s)=>t+s.borc,0)),a=r2(L.reduce((t,s)=>t+s.alacak,0));
  if(!L.length)throw new Error('Fişte tutar yok');
  if(b!==a)throw new Error('Fiş dengesiz: Borç '+fmt(b)+' ≠ Alacak '+fmt(a));
  L.forEach(s=>{if(!hesapBul(s.hesap))throw new Error('Hesap planında yok: '+s.hesap);if(baslikMi(s.hesap))throw new Error(s.hesap+' bir başlık hesabıdır (sınıf/grup); kayıt yapılamaz. Ana veya alt hesabı seçin.')});
  const f={id:uid(),no:(S.ayar.sayac.fis=(S.ayar.sayac.fis||0)+1,'YF'+pad(S.ayar.sayac.fis,6)),tarih,aciklama:aciklama||'',kaynak:kaynak||null,satirlar:L};
  S.fisler.push(f);_bm=null;return f.id;
}
function kilitKontrol(t){const k=S.ayar&&S.ayar.kilit;if(k&&t&&t<=k)throw new Error('Dönem kilitli: '+tTR(t)+' tarihli kayıt, '+tTR(k)+' ve öncesi için kilitlenmiş. Değiştirmek için Ayarlar › Firma & Genel bölümünden dönem kilidini kaldırın ya da daha eski bir tarih verin.')}
const fisSil=(tip,id)=>{_bm=null;S.fisler.forEach(f=>{if(f.kaynak&&f.kaynak.tip===tip&&f.kaynak.id===id)kilitKontrol(f.tarih)});S.fisler=S.fisler.filter(f=>!(f.kaynak&&f.kaynak.tip===tip&&f.kaynak.id===id))};
const fisSira=(a,b)=>a.tarih.localeCompare(b.tarih)||a.no.localeCompare(b.no);
function BM(){if(_bm)return _bm;_bm={};for(const f of S.fisler)for(const s of f.satirlar)_bm[s.hesap]=(_bm[s.hesap]||0)+s.borc-s.alacak;return _bm}
function bak(kod){if(!kod)return 0;const m=BM();let t=0;for(const k in m)if(altMi(k,kod))t+=m[k];return r2(t)}
function bakAralik(bas,bit,haric,kapDahil){const m={};for(const f of S.fisler){if(!kapDahil&&f.kaynak&&f.kaynak.tip==='kapanis')continue;if(bas&&f.tarih<bas)continue;if(bit&&f.tarih>bit)continue;if(haric&&haric(f))continue;for(const s of f.satirlar){const o=m[s.hesap]||(m[s.hesap]={b:0,a:0});o.b+=s.borc;o.a+=s.alacak}}return m}
function ekstre(kodlar,bas,bit){
  const eslesir=k=>kodlar.some(x=>altMi(k,x));let acilis=0;const rows=[];
  for(const f of [...S.fisler].sort(fisSira))for(const s of f.satirlar){if(!eslesir(s.hesap))continue;if(bas&&f.tarih<bas){acilis+=s.borc-s.alacak;continue}if(bit&&f.tarih>bit)continue;rows.push({f,s})}
  return{acilis:r2(acilis),rows};
}
function gg(bas,bit){const m=bakAralik(bas,bit);let gelir=0,gider=0;for(const k in m){const h=hesapBul(k);if(!h)continue;if(h.grup==='gelir')gelir+=m[k].a-m[k].b;else if(h.grup==='gider')gider+=m[k].b-m[k].a}return{gelir:r2(gelir),gider:r2(gider),net:r2(gelir-gider)}}
function aylikVeri(yil){
  const g=Array(12).fill(0),x=Array(12).fill(0),mat={gelir:{},gider:{}};
  for(const f of S.fisler){if(f.tarih.slice(0,4)!=yil||(f.kaynak&&f.kaynak.tip==='kapanis'))continue;const mi=+f.tarih.slice(5,7)-1;

      if(h.grup==='gelir'){const v=s.alacak-s.borc;g[mi]+=v;(mat.gelir[s.hesap]||(mat.gelir[s.hesap]=Array(12).fill(0)))[mi]+=v}
      else if(h.grup==='gider'){const v=s.borc-s.alacak;x[mi]+=v;(mat.gider[s.hesap]||(mat.gider[s.hesap]=Array(12).fill(0)))[mi]+=v}}}
  return{gelir:g.map(r2),gider:x.map(r2),mat};
}

function kasaEkle(k){const ana={kasa:'100',banka:'102',pos:'108',kart:'300'}[k.tur];const o=Object.assign({id:uid(),ad:'',tur:'kasa',iban:'',komisyon:0},k);if(!o.hesapKod)o.hesapKod=yeniAltHesap(ana,o.ad);S.kasalar.push(o);return o}

/* ---------------- Fatura ---------------- */
const TUR_AD={satis:'Satış Faturası',alis:'Alış Faturası',satis_iade:'Satış İade',alis_iade:'Alış İade'};
const TUR_ON={satis:'SF',alis:'AF',satis_iade:'SI',alis_iade:'AI'};
const kalemTur=t=>t.startsWith('satis')?'gelir':'gider';
function satirHesap(s,dahil){const brut=(Number(s.adet)||0)*(Number(s.fiyat)||0);let m,k;if(dahil){const t=r2(brut);m=r2(t/(1+s.kdv/100));k=r2(t-m)}else{m=r2(brut);k=r2(m*s.kdv/100)}return{m,k,t:r2(m+k)}}
function odenenFatura(f,haric){let t=0;const topla=(arr,tip)=>arr.forEach(x=>{if(haric&&haric.tip===tip&&haric.id===x.id)return;(x.dagitim||[]).forEach(d=>{if(d.faturaId===f.id)t+=d.tutar})});topla(S.hareketler,'hareket');topla(S.cekler,'cek');return r2(t)}
const faturaKalan=(f,haric)=>r2(f.toplam-(f.kesinti||0)-odenenFatura(f,haric));
function fDurum(f){if(f.tur.endsWith('iade')){const ki=faturaKalan(f);return ki<=0.004?{t:'İade kapandı',c:'grn'}:{t:'İade · açık',c:'amb'}}const k=faturaKalan(f);if(k<=0.004)return{t:'Ödendi',c:'grn'};const vd=f.vade||f.tarih;if(vd<bugun())return{t:'Vadesi Geçti',c:'red'};return{t:k<f.toplam?'Kısmi':'Açık',c:k<f.toplam?'amb':'blu'}}
const KESINTI=[{id:'',ad:'Kesinti yok'}].concat([2,3,4,5,7,9,10].map(n=>({id:'tev'+n,tur:'tev',oran:n/10,ad:'KDV tevkifatı '+n+'/10'})),[{id:'stpSm',tur:'stp',oran:.2,ad:'Stopaj – Serbest meslek %20'},{id:'stpKira',tur:'stp',oran:.2,ad:'Stopaj – Kira (GMSİ) %20'}]);
const HESAP_TEV='360.03',HESAP_STP='360.01',HESAP_STP_MAH='193.01';
function kesintiHesapla(f){const ks=f.kesintiId?KESINTI.find(x=>x.id===f.kesintiId):null;if(!ks)return{tut:0,ks:null,tev:{}};
  if(ks.tur==='stp')return{tut:r2(f.matrah*ks.oran),ks,tev:{}};
  const kg={};f.satirlar.forEach(x=>{if(x.k)kg[x.kdv]=r2((kg[x.kdv]||0)+x.k)});const tev={};let t=0;
  for(const o in kg){tev[o]=r2(kg[o]*ks.oran);t=r2(t+tev[o])}
  if(!(t>0))throw new Error('Faturada KDV yok; KDV tevkifatı uygulanamaz');return{tut:t,ks,tev}}
function _faturaKaydet(f){
  const c=cariBul(f.cariId);if(!c)throw new Error('Cari seçin');
  if(!f.satirlar.length)throw new Error('En az bir satır girin');
  let m=0,k=0;f.satirlar.forEach(s=>{const h=satirHesap(s,f.kdvDahil);s.m=h.m;s.k=h.k;s.t=h.t;m+=h.m;k+=h.k});
  f.matrah=r2(m);f.kdv=r2(k);f.toplam=r2(m+k);if(f.toplam<=0)throw new Error('Fatura tutarı sıfır olamaz');
  if(!f.vade){f.vade=addDays(f.tarih,Number(c.vadeGun)||0)}
  const i=S.faturalar.findIndex(x=>x.id===f.id);
  if(i>=0){fisSil('fatura',f.id);S.faturalar[i]=f}else{f.id=f.id||uid();if(!f.no)f.no=sonrakiNo('fatura-'+f.tur,TUR_ON[f.tur]);S.faturalar.push(f)}
  const grp={};f.satirlar.forEach(s=>{const kl=kalemBul(s.kalemId);const hk=kl?kl.hesapKod:(f.tur.startsWith('satis')?'600.01':'770.15');grp[hk]=r2((grp[hk]||0)+s.m)});
  const kdvG={};f.satirlar.forEach(s=>{if(s.k)kdvG[s.kdv]=r2((kdvG[s.kdv]||0)+s.k)});
  const L=[];const gelir=f.tur.startsWith('satis'),iade=f.tur.endsWith('iade');
  const cari=cariHesap(c,gelir?'120':'320');
  const kes=kesintiHesapla(f);if(kes.tut>=f.toplam)throw new Error('Kesinti fatura tutarından büyük olamaz');

  // satış: 120 B / 600 A / 391 A ; alış: gider B / 191 B / 320 A ; iadelerde ters
  // kesinti: alış → 320 daha az borçlanır, kesinti 360.xx'e yazılır; satış → 120 daha az, stopaj 193'e, tevkifat 391'den düşer
  const cTut=r2(f.toplam-kes.tut);
  L.push(gelir?{hesap:cari,[iade?'alacak':'borc']:cTut}:{hesap:cari,[iade?'borc':'alacak']:cTut});
  for(const hk in grp){const yon=gelir?(iade?'borc':'alacak'):(iade?'alacak':'borc');L.push({hesap:hk,[yon]:grp[hk]})}
  for(const o in kdvG){const ana=gelir?'391':'191';const yon=gelir?(iade?'borc':'alacak'):(iade?'alacak':'borc');const v=r2(kdvG[o]-(gelir?(kes.tev[o]||0):0));if(v)L.push({hesap:kdvHesap(ana,Number(o)),[yon]:v})}
  if(kes.ks&&!gelir){const yon=iade?'borc':'alacak';if(kes.ks.tur==='tev'){hesapEkle(HESAP_TEV,'Ödenecek KDV – Tevkifat (Sorumlu Sıfatıyla)','pasif');L.push({hesap:HESAP_TEV,[yon]:kes.tut})}else L.push({hesap:HESAP_STP,[yon]:kes.tut})}
  if(kes.ks&&gelir&&kes.ks.tur==='stp'){hesapEkle('193','Peşin Ödenen Vergiler ve Fonlar','aktif');hesapEkle(HESAP_STP_MAH,'Kesilen Stopaj (Mahsup Edilecek)','aktif');L.push({hesap:HESAP_STP_MAH,[iade?'alacak':'borc']:kes.tut})}
  fisYaz({tarih:f.tarih,aciklama:TUR_AD[f.tur]+' '+f.no+' - '+c.ad,kaynak:{tip:'fatura',id:f.id},satirlar:L});
}

/* Tahsilat/ödeme hangi cari hesabına işlenir? Müşteri grubu → 120 (iade ödemesi dahil), tedarikçi grubu → 320 (iade tahsili dahil); iki taraflı grupta mahsup edilen faturaya / bakiyeye göre */
function tahRol(h,c){const y=cariGrup(c).yon;if(y==='alacak')return'120';if(y==='borc')return'320';
  const fr=(h.dagitim||[]).map(x=>{const f=S.faturalar.find(z=>z.id===x.faturaId);return f?(f.tur.startsWith('satis')?'120':'320'):''}).find(Boolean);if(fr)return fr;
  const b1=c.h120?bak(c.h120):0,b3=c.h320?bak(c.h320):0;
  if(h.tur==='odeme'&&b1<-0.004&&!(b3<-0.004))return'120';if(h.tur==='tahsilat'&&b3>0.004&&!(b1>0.004))return'320';
  return h.tur==='tahsilat'?'120':'320'}
function _hareketKaydet(h){
  const kasa=kasaBul(h.kasaId);if(!kasa&&h.tur!=='virman'&&h.tur!=='posYatis')throw new Error('Kasa / banka hesabı seçin');
  const t=r2(h.tutar);if(!(t>0))throw new Error('Tutar girin');
  if(h.dagitim){const top=r2(h.dagitim.reduce((a,d)=>a+d.tutar,0));if(top>t+0.004)throw new Error('Fatura dağıtımı ('+fmt(top)+') tutardan ('+fmt(t)+') büyük olamaz');
    h.dagitim.forEach(d=>{const f=S.faturalar.find(x=>x.id===d.faturaId);if(!f)throw new Error('Fatura bulunamadı');if(d.tutar>faturaKalan(f,{tip:'hareket',id:h.id})+0.004)throw new Error(f.no+' için kalan tutardan fazla kapatılamaz')})}
  const i=S.hareketler.findIndex(x=>x.id===h.id);
  const eski=i>=0?S.hareketler[i]:null;
  if(i>=0){fisSil('hareket',h.id);S.hareketler[i]=h}else{h.id=h.id||uid();S.hareketler.push(h)}
  const K={tip:'hareket',id:h.id};let L=[],ac='';
  const c=h.cariId?cariBul(h.cariId):null;
  if(h.tur==='tahsilat'){if(!c)throw new Error('Cari seçin');const rl=tahRol(h,c);ac=(rl==='320'?'Tahsilat (iade) - ':'Tahsilat - ')+c.ad;L=[{hesap:kasa.hesapKod,borc:t},{hesap:cariHesap(c,rl),alacak:t}]}
  else if(h.tur==='odeme'){if(!c)throw new Error('Cari seçin');const rl=tahRol(h,c);ac=(rl==='120'?'Ödeme (iade) - ':'Ödeme - ')+c.ad;L=[{hesap:cariHesap(c,rl),borc:t},{hesap:kasa.hesapKod,alacak:t}]}
  else if(h.tur==='gelir'||h.tur==='gider'){
    const kl=kalemBul(h.kalemId);if(!kl)throw new Error('Kalem seçin');const m=r2(h.matrah),k=r2(h.kdv);
    if(h.tur==='gelir'){ac='Gelir - '+kl.ad;L=[{hesap:kasa.hesapKod,borc:t},{hesap:kl.hesapKod,alacak:m}];if(k)L.push({hesap:kdvHesap('391',h.kdvOran),alacak:k})}
    else{ac='Gider - '+kl.ad;L=[{hesap:kl.hesapKod,borc:m},{hesap:kasa.hesapKod,alacak:t}];if(k)L.splice(1,0,{hesap:kdvHesap('191',h.kdvOran),borc:k})}}
  else if(h.tur==='virman'){const hd=kasaBul(h.hedefId);if(!kasa||!hd)throw new Error('Kaynak ve hedef hesabı seçin');if(kasa.id===hd.id)throw new Error('Kaynak ve hedef aynı olamaz');ac='Virman '+kasa.ad+' → '+hd.ad;L=[{hesap:hd.hesapKod,borc:t},{hesap:kasa.hesapKod,alacak:t}]}
  else if(h.tur==='posYatis'){const pos=kasaBul(h.posId),bnk=kasaBul(h.bankaId);if(!pos||!bnk)throw new Error('POS ve banka hesabı seçin');const kom=r2(h.komisyon);if(kom>=t)throw new Error('Komisyon brüt tutardan küçük olmalı');ac='POS hesaba geçiş '+pos.ad;L=[{hesap:bnk.hesapKod,borc:r2(t-kom)},{hesap:'653.01',borc:kom},{hesap:pos.hesapKod,alacak:t}]}
  else if(h.tur==='maas'){const p=S.personel.find(x=>x.id===h.personelId);if(!p)throw new Error('Personel bulunamadı');ac=(h.avans&&!h.bordroId&&!h.netTahId?'Personel avansı - ':'Maaş ödemesi - ')+p.ad;L=[{hesap:personelHesap(p),borc:t},{hesap:kasa.hesapKod,alacak:t}]}

  else if(h.tur==='hesap'){const hk=hesapBul(h.hesap);if(!hk||baslikMi(h.hesap)||altlar(h.hesap).length)throw new Error('Karşı hesabı seçin (alt hesap olmalı)');if(h.hesap===kasa.hesapKod)throw new Error('Karşı hesap, banka hesabının kendisi olamaz');ac=hk.ad;L=h.yon==='giris'?[{hesap:kasa.hesapKod,borc:t},{hesap:h.hesap,alacak:t}]:[{hesap:h.hesap,borc:t},{hesap:kasa.hesapKod,alacak:t}]}

    if(fark){if(!hesapBul(h.farkHesap)||baslikMi(h.farkHesap))throw new Error('İndirim / fark için hesap seçin');if(!(r2(t+fark)>0))throw new Error('Kapatılan borç tutarı sıfırdan büyük olmalı');if(fark>0){L.push({hesap:h.farkHesap,alacak:fark});ac+=' (indirim '+fmt(fark)+')'}else{L.push({hesap:h.farkHesap,borc:-fark});ac+=' (borç dışı ek ödeme '+fmt(-fark)+')'}}}
  else throw new Error('Bilinmeyen işlem');
  if(h.aciklama&&h.tur!=='borcOdeme')ac+=' ('+h.aciklama+')';
  if(!h.no)h.no=eski?eski.no:sonrakiNo('hareket-'+h.tur,{tahsilat:'TH',odeme:'OD',gelir:'GL',gider:'GD',virman:'VR',posYatis:'PY',maas:'MS',borcOdeme:'BO',askida:'AS',hesap:'HS'}[h.tur]);
  fisYaz({tarih:h.tarih,aciklama:ac,kaynak:K,satirlar:L});
}

const cekHesap=c=>c.yon==='alinan'?(c.tip==='cek'?'101':'121'):(c.tip==='cek'?'103':'321');
function _cekKaydet(c){

  c.tutar=r2(c.tutar);
  if(c.dagitim){const top=r2(c.dagitim.reduce((a,d)=>a+d.tutar,0));if(top>c.tutar+0.004)throw new Error('Fatura dağıtımı tutardan büyük olamaz');
    c.dagitim.forEach(d=>{const f=S.faturalar.find(x=>x.id===d.faturaId);if(f&&d.tutar>faturaKalan(f,{tip:'cek',id:c.id})+0.004)throw new Error(f.no+' için kalan tutardan fazla kapatılamaz')})}

  const L=c.yon==='alinan'?[{hesap:cekHesap(c),borc:c.tutar},{hesap:cariHesap(cr,'120'),alacak:c.tutar}]:[{hesap:cariHesap(cr,'320'),borc:c.tutar},{hesap:cekHesap(c),alacak:c.tutar}];

}
function _cekDurum(id,durum,o){

  const ch=cekHesap(c),kasa=o.kasaId?kasaBul(o.kasaId):null;const ad=(c.tip==='cek'?'Çek ':'Senet ')+c.no;

  else if(durum==='ciro'){const t=cariBul(o.cariId);if(!t)throw new Error('Ciro edilecek cariyi seçin');L=[{hesap:cariHesap(t,'320'),borc:c.tutar},{hesap:ch,alacak:c.tutar}];ac=ad+' ciro edildi → '+t.ad;c.ciroCari=t.id}

  else if(durum==='odendi'){if(!kasa)throw new Error('Kasa / banka seçin');L=[{hesap:ch,borc:c.tutar},{hesap:kasa.hesapKod,alacak:c.tutar}];ac=ad+' ödendi - '+cr.ad}

function _cekGeriAl(id){const c=S.cekler.find(x=>x.id===id);if(!c||c.gecmis.length<2)throw new Error('Geri alınacak işlem yok');const g=c.gecmis.pop();if(g.fisId){_bm=null;S.fisler=S.fisler.filter(f=>f.id!==g.fisId)}if(g.dagitimYedek)c.dagitim=g.dagitimYedek;c.durum=g.onceki}
const cekDurumAd={portfoy:'Portföyde',bankada:'Bankada',tahsil:'Tahsil edildi',ciro:'Ciro edildi',karsiliksiz:'Karşılıksız',beklemede:'Ödeme bekliyor',odendi:'Ödendi'};

/* ---------------- Personel / Bordro ---------------- */
function personelHesap(p){if(!p.hesap){p.hesap=yeniAltHesap('335',p.ad,3)}return p.hesap}
function bordroHesap(brut,p={}){
  const A=S.ayar,tavan=A.sgkTavan>0?A.sgkTavan:1e12,sm=Math.min(brut,tavan);

const ayGun=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
function aylarAraligi(bas,bit){const o=[];let[y,m]=bas.split('-').map(Number);const[by,bm]=bit.split('-').map(Number);while((y<by||(y===by&&m<=bm))&&o.length<600){o.push(y+'-'+pad(m));m++;if(m>12){m=1;y++}}return o}
function tahakkukBekleyen(t,sonAy){if(!t.aktif||!t.baslangic)return[];const bit=t.bitis&&t.bitis<sonAy?t.bitis:sonAy;if(bit<t.baslangic)return[];return aylarAraligi(t.baslangic,bit).filter(a=>!(t.uretilen||[]).includes(a))}
function _tahakkukUret(sonAy){let n=0;
  S.tekrarlar.forEach(t=>{tahakkukBekleyen(t,sonAy).forEach(ym=>{if(!cariBul(t.cariId))throw new Error(t.ad+': cari bulunamadı');const gelir=t.yon==='gelir';const gun=Math.min(t.gun||1,ayGun(ym));
    _faturaKaydet({id:uid(),tur:gelir?'satis':'alis',tarih:ym+'-'+pad(gun),vade:'',cariId:t.cariId,satirlar:[{kalemId:t.kalemId,ad:t.ad+' – '+AYLAR[+ym.slice(5)-1]+' '+ym.slice(0,4),adet:1,fiyat:t.tutar,kdv:t.kdv}],kdvDahil:!!t.kdvDahil,aciklama:'Aylık tahakkuk: '+t.ad,tekrarId:t.id,donem:ym});
    (t.uretilen||(t.uretilen=[])).push(ym);n++})});return n}
function tekrarSecenek(fm,yon){const c=fm.elements.cariId,k=fm.elements.kalemId,cv=c.value,kv=k.value;
  c.innerHTML=cariOpts('— Cari seçin —',yon==='gelir'?'alacak':'borc').map(o=>`<option value="${esc(o.v)}">${esc(o.t)}</option>`).join('');
  k.innerHTML=kalemOpts(yon).map(o=>`<option value="${esc(o.v)}">${esc(o.t)}</option>`).join('');
  if([...c.options].some(o=>o.value===cv))c.value=cv;if([...k.options].some(o=>o.value===kv))k.value=kv}
function tekrarForm(id){
  const t=id?S.tekrarlar.find(x=>x.id===id):{ad:'',yon:'gider',cariId:'',kalemId:'',tutar:'',kdv:0,kdvDahil:false,gun:1,baslangic:bugun().slice(0,7),bitis:'',aktif:true,uretilen:[]};
  const kilit=!!(id&&(t.uretilen||[]).length);const cariN=(c)=>cariOpts('— Cari seçin —',t.yon==='gelir'?'alacak':'borc');
  const ro=kilit?'disabled':'';
  modal({title:id?'Tekrarlı Faturayı Düzenle':'Yeni Tekrarlı Fatura',wide:true,html:`<div class="fg">${inp('Tanım','ad',t.ad,'required placeholder="Örn: Depo kirası"')}${sel('Tür','yon',[{v:'gider',t:'Gider (alış faturası açar)'},{v:'gelir',t:'Gelir (satış faturası açar)'}],t.yon,'data-chg="tekrarYon" '+ro)}${sel('Cari (ev sahibi / kiracı / kurum)','cariId',cariN(),t.cariId,ro)}${sel('Gelir / gider kalemi','kalemId',kalemOpts(t.yon),t.kalemId||'',ro)}${inp('Aylık tutar (₺)','tutar',t.tutar,'type="number" step="0.01" min="0" required')}${sel('KDV %','kdv',S.ayar.kdv.map(o=>({v:o,t:'%'+o})),t.kdv)}${sel('Tutar','kdvDahil',[{v:'0',t:'KDV hariç'},{v:'1',t:'KDV dahil'}],t.kdvDahil?'1':'0')}${inp('Ayın kaçıncı günü','gun',t.gun,'type="number" min="1" max="31"')}${inp('Başlangıç ayı','baslangic',t.baslangic,'type="month" required')}${inp('Bitiş ayı (boşsa süresiz)','bitis',t.bitis,'type="month"')}${sel('Durum','aktif',[{v:'1',t:'Aktif'},{v:'0',t:'Durduruldu'}],t.aktif?'1':'0')}</div><p class="mut">${kilit?'Bu tanımdan fatura üretildiği için tür, cari ve kalem değiştirilemez; tutar, gün ve bitiş ayı sonraki aylar için değiştirilebilir.':'Her ay için fatura (tahakkuk) otomatik açılır; vade carinin vade gününden gelir.'}</p>`,
  ok:f=>tx(()=>{const o=id?t:{id:uid(),uretilen:[]};const v={ad:val(f,'ad'),tutar:num(f,'tutar'),kdv:num(f,'kdv'),kdvDahil:val(f,'kdvDahil')==='1',gun:Math.round(num(f,'gun')),baslangic:val(f,'baslangic'),bitis:val(f,'bitis'),aktif:val(f,'aktif')==='1'};

    if(!kilit){if(!v.cariId)throw new Error('Cari seçin');if(!v.kalemId)throw new Error('Kalem seçin');const c=cariBul(v.cariId),y=cariGrup(c).yon;if(!(y==='ikisi'||y===(v.yon==='gelir'?'alacak':'borc')))throw new Error(c.ad+' ('+grupKisa(cariGrup(c))+' grubu) bu türde kullanılamaz')}

}

/* ---------- HESAP PLANI ---------- */
function oneriKod(ust){const v=seviye(ust);
  if(v==='sinif'||v==='grup'){for(let i=0;i<10;i++){const k=ust+i;if(!hesapBul(k))return k}return''}
  const pre=ust+'.';const n=Math.max(0,...S.hesaplar.filter(h=>h.kod.startsWith(pre)&&/^\d+$/.test(h.kod.slice(pre.length))).map(h=>parseInt(h.kod.slice(pre.length),10)))+1;return pre+pad(n,2)}
function kuralMetni(ust){const v=seviye(ust),o=oneriKod(ust);return v==='sinif'?'Sınıf altına 2 haneli GRUP açılır; kod "'+ust+'" ile başlamalı (örn. '+o+').':v==='grup'?'Grup altına 3 haneli ANA HESAP açılır; kod "'+ust+'" ile başlamalı (örn. '+o+').':'ALT HESAP açılır; kod "'+ust+'.xx" biçiminde olmalı (örn. '+o+'). Kayıt yalnızca en alttaki hesaba yapılır.'}
function kodDogrula(k,ust){
  const u=hesapBul(ust);if(!u)return'Üst hesap bulunamadı';
  if(SISTEM_ANA.includes(ust))return ust+' çek/senet modülünün sistem hesabıdır; altına hesap açılamaz';
  const v=seviye(ust);
  if(v==='sinif'){if(!/^\d{2}$/.test(k)||k[0]!==ust)return'"'+ust+'" sınıfının altına yalnızca "'+ust+'" ile başlayan 2 haneli grup açılabilir (örn. '+oneriKod(ust)+')'}
  else if(v==='grup'){if(!/^\d{3}$/.test(k)||!k.startsWith(ust))return'"'+ust+'" grubunun altına yalnızca "'+ust+'" ile başlayan 3 haneli ana hesap açılabilir (örn. '+oneriKod(ust)+')'}
  else if(!new RegExp('^'+ust.replace(/\./g,'\\.')+'\\.\\d+$').test(k))return ust+' hesabının altına yalnızca "'+ust+'.xx" biçiminde alt hesap açılabilir (örn. '+oneriKod(ust)+')';
  if(hesapBul(k))return'Bu kod zaten kullanılıyor: '+k;
  if((v==='ana'||v==='alt')&&S.fisler.some(f=>f.satirlar.some(x=>x.hesap===ust)))return ust+' hesabında doğrudan kayıt var; altına hesap açılırsa bakiye bölünür. Önce kayıtları alt hesaba taşıyın.';
  return''}
const HESAP_KORUMALI=['100','101','102','103','108','120','121','136','190','191','320','321','335','336','360','361','391','136.99','360.01','360.02','361.01','653.01','600.01','770.15','770.01'];
const HTUR={aktif:'Aktif',pasif:'Pasif',ozkaynak:'Özkaynak',gelir:'Gelir',gider:'Gider'};
function hesapKoruma(k){const alt=h=>h===k||h.startsWith(k+'.');
  const sis=[...Object.keys(SISTEM),...SISTEM_ANA,...HESAP_KORUMALI].find(alt);if(sis)return SISTEM[sis]||('program bu kodu doğrudan kullanıyor ('+sis+')');
  if(S.cariGruplari.some(g=>[g.alacakAna,g.borcAna].some(a=>a&&alt(a))))return'bir cari grubunun ana hesabı (Ayarlar › Cari Grupları)';
  return''}
function hesapFisSay(k){let n=0;S.fisler.forEach(f=>f.satirlar.forEach(x=>{if(x.hesap===k||x.hesap.startsWith(k+'.'))n++}));return n}
function hesapRefYenile(e,y){

function mutabakat(){const A=IMP.ayar,k=kasaBul(A.kasaId);if(!k)return null;const R=icBankaAnaliz().filter(x=>x.yon&&x.tarih);if(!R.length)return null;

  const E=[];R.forEach(x=>{x.esl=null});
  [0,3].forEach(tol=>R.forEach(x=>{if(x.esl)return;const m=D.find(d=>!d.kul&&d.yon===x.yon&&Math.abs(d.tutar-x.tutar)<0.005&&Math.abs(gunFark(d.f.tarih,x.tarih))<=tol);if(m){m.kul=true;x.esl=m}}));

  const eGi=r2(R.filter(x=>x.yon==='giris').reduce((t,x)=>t+x.tutar,0)),eCi=r2(R.filter(x=>x.yon==='cikis').reduce((t,x)=>t+x.tutar,0));
  const dd=D.filter(d=>d.f.tarih>=bas&&d.f.tarih<=bit),dGi=r2(dd.filter(d=>d.yon==='giris').reduce((t,d)=>t+d.tutar,0)),dCi=r2(dd.filter(d=>d.yon==='cikis').reduce((t,d)=>t+d.tutar,0));
  const mb=bakAralik('',bit,null,true)[k.hesapKod],defBak=mb?r2(mb.b-mb.a):0,ekBak=sayiOku(A.mutBak),fark=r2((eGi-eCi)-(dGi-dCi));

  let h=`<div class="${!eksik.length&&!fazla.length&&Math.abs(fark)<0.005?'note':'warn'}">${!eksik.length&&!fazla.length&&Math.abs(fark)<0.005?'✓ Ekstre ile defteriniz uyumlu.':'Fark var: aşağıdaki iki listeyi kontrol edin.'}</div>
  <div class="grid g4">${kart('Ekstre net hareket',money(r2(eGi-eCi)))}${kart('Defter net hareket (aynı tarihler)',money(r2(dGi-dCi)))}${kart('Fark',money(fark),Math.abs(fark)<0.005?'pos':'neg')}${kart('Defterdeki banka bakiyesi ('+tTR(bit)+')',money(defBak))}</div>

  const t1=eksik.length?`<h3 style="margin:16px 0 6px">Ekstrede var, defterde yok (${eksik.length})</h3><p class="mut" style="margin:0 0 6px">Bankada gerçekleşmiş ama kaydedilmemiş olabilir. "Eksik satırları aktarmaya geç" ile bunları aktarabilirsiniz.</p>${tblA(['Satır','Tarih','Açıklama','Giriş','Çıkış'],eksik.slice(0,300).map(x=>[String(x.i+1),tTR(x.tarih),x.ac,x.yon==='giris'?x.tutar:'',x.yon==='cikis'?x.tutar:'']))}`:'';

function rpBilanco(F){

/* ---------------- Sütun genişliği + sütun gizle/göster (masaüstü; bu tarayıcıda hatırlanır) ----------------

   Genişlik kaydı yoksa sütunlar içeriğe göre otomatik sığdırılır (azami SW_MAX px), tablo konteyneri doldurmaya zorlanmaz. */
const SW_ANAHTAR='kd_sw2',SW_MAX=340,SW_MIN=48,SW_SECILEBILIR=6;
const swOku=()=>{try{return JSON.parse(localStorage.getItem(SW_ANAHTAR)||'{}')||{}}catch(e){return{}}};
const swYaz=o=>{try{localStorage.setItem(SW_ANAHTAR,JSON.stringify(o))}catch(e){}};
const swBasliklar=t=>[...t.querySelectorAll('thead th')].filter(h=>!h.classList.contains('fl'));
const swHucre=tr=>[...tr.children].filter(c=>!c.classList.contains('fl'));
const swAnahtar=t=>UI.page+'|'+swBasliklar(t).map(h=>h.textContent.trim()).join('~');
const swMasaustu=()=>window.matchMedia('(min-width:861px)').matches;
function swDurum(t){const o=swOku()[swAnahtar(t)];if(Array.isArray(o))return{w:o,h:[]};return{w:Array.isArray(o&&o.w)?o.w:null,h:Array.isArray(o&&o.h)?o.h:[]}}
function swKaydet(t,d){const o=swOku(),k=swAnahtar(t);if(!d.w&&!d.h.length)delete o[k];else o[k]={w:d.w,h:d.h};swYaz(o)}
/* satırlardaki hücreleri gizli sütunlara göre göster/gizle (colspan'lı satırlar da doğru daralır) */
function swGizle(t,h){
  const n=swBasliklar(t).length,hs=new Set(h);
  /* her satırın sonuna boş "doldurucu" hücre eklenir: tablo her zaman çerçeveyi doldurur, sütun genişlikleri ise tam olarak ayarlanabilir kalır */
  t.querySelectorAll('tr').forEach(tr=>{let c=0;const hc=swHucre(tr);if(!hc.length)return;hc.forEach(td=>{
    if(td.dataset.cs===undefined)td.dataset.cs=td.colSpan||1;const cs=+td.dataset.cs;let vis=0;for(let j=c;j<c+cs&&j<n;j++)if(!hs.has(j))vis++;
    c+=cs;if(vis===0){td.style.display='none'}else{td.style.display='';if(cs>1)td.colSpan=vis}});
    const son=hc[hc.length-1],fl=tr.querySelector(':scope>.fl');
    if(son.style.display!=='none'&&+son.dataset.cs>1){son.colSpan=son.colSpan+1;if(fl)fl.remove()}
    else if(!fl){const e=document.createElement(son.tagName.toLowerCase());e.className='fl';tr.appendChild(e)}})}
function swGorunur(n,h){const hs=new Set(h),a=[];for(let i=0;i<n;i++)if(!hs.has(i))a.push(i);return a}
/* w: tüm sütunlar için genişlik dizisi; yalnız görünür olanlar colgroup'a yazılır */
function swUygula(t,w,h){

  const top=vis.reduce((a,i)=>a+w[i],0),tw=t.closest('.tw'),fl=Math.max(0,(tw?tw.clientWidth:0)-top);
  cg.innerHTML=vis.map(i=>`<col style="width:${w[i]}px">`).join('')+`<col style="width:${fl}px">`;
  t.classList.add('swc');t.style.width=(top+fl)+'px'}
/* Otomatik yerleşim: sütunlar içeriğe göre ölçülür; konteynerden artan yer metin sütunlarına (açıklama, ünvan…) verilir,
   sayı / işlem sütunları dar kalır. İçerik konteynerden genişse metin sütunları daraltılır, yine sığmazsa yatay kaydırma çıkar. */
function swDogal(t,h){
  t.classList.remove('swc');t.style.width='max-content';const cg=t.querySelector('colgroup');if(cg)cg.innerHTML='';
  const ths=swBasliklar(t),hs=new Set(h||[]);
  const raw=ths.map(th=>hs.has(ths.indexOf(th))?0:Math.round(th.getBoundingClientRect().width));
  t.style.width='';

  if(F.d1)L=L.filter(x=>ymd(new Date(x.t))>=F.d1);if(F.d2)L=L.filter(x=>ymd(new Date(x.t))<=F.d2);
  if(q)L=L.filter(x=>norm(x.k+' '+x.a).includes(q));return L}
const LOG_SAYFA=100;

  const kul=[...new Set([...(S.log||[]).map(x=>x.k),...S.kullanicilar.map(u=>u.ad)])].sort((a,b)=>a.localeCompare(b,'tr'));
  const d24=Date.now()-864e5,hata=(S.log||[]).filter(x=>x.o==='giris-hata'&&Date.parse(x.t)>d24).length,toplam=(S.log||[]).length;
  const rows=L.slice(F.sy*LOG_SAYFA,(F.sy+1)*LOG_SAYFA).map(x=>{const[ad,c]=OLAY[x.o]||[x.o,''];return[{h:`<span style="white-space:nowrap">${zamanTR(x.t)}</span>`},x.k,{h:badge(ad,c)},x.a]});
  return kulSekme('l')+`<div class="bar"><select data-f="log.u"><option value="">Tüm kullanıcılar</option>${kul.map(k=>`<option ${F.u===k?'selected':''}>${esc(k)}</option>`).join('')}</select><select data-f="log.o"><option value="">Tüm olaylar</option>${Object.keys(OLAY).map(k=>`<option value="${k}" ${F.o===k?'selected':''}>${OLAY[k][0]}</option>`).join('')}</select><label class="chk">Başlangıç <input type="date" data-f="log.d1" value="${esc(F.d1)}"></label><label class="chk">Bitiş <input type="date" data-f="log.d2" value="${esc(F.d2)}"></label><input data-f="log.q" value="${esc(F.q)}" placeholder="Ara: kullanıcı, ayrıntı…"><span class="sp"></span><button class="btn" data-act="logCsv">⬇ CSV (${L.length})</button></div>
  <div class="bar">${badge(toplam+' kayıt')} ${hata?badge('Son 24 saatte '+hata+' hatalı giriş','red'):badge('Son 24 saatte hatalı giriş yok','grn')} ${toplam>LOG_MAX*0.9?badge('Log dolmak üzere: en eski kayıtlar silinir, CSV indirin','amb'):''}</div>
  <div class="card">${tblA(['Tarih / saat','Kullanıcı','Olay','Ayrıntı'],rows)}${sn>1?`<div class="bar" style="margin:10px 0 0"><button class="btn sm" data-act="logSayfa" data-d="-1" ${F.sy<=0?'disabled':''}>‹ Yeni</button><span class="mut">Sayfa ${F.sy+1} / ${sn}</span><button class="btn sm" data-act="logSayfa" data-d="1" ${F.sy>=sn-1?'disabled':''}>Eski ›</button></div>`:''}</div>

/* ---------------- ÇEVRİMİÇİ SÜRÜM: kurulabilir uygulama, otomatik güncelleme, Google Drive senkronu ----------------
   • Dosya olarak (file://) açıldığında hiçbiri çalışmaz; program eskisi gibi tek dosyadır.
   • https adresinde yayınlanınca: çevrimdışı çalışır, yeni sürümü arka planda indirir, yöneticiye "Güncelle" sorar (önce yedek alır).
   • Google Drive: isteğe bağlı; veri bu cihazda kalır, Drive'daki "kobi-defter-veri.json" dosyasına eşlenir. */
const ONLINE=/^https?:$/.test(location.protocol);
let SWREG=null,SWBEKLEYEN=null,YUKLE_OLAY=null,GUNC_BILGI='',_gunc=false,_gErtele=false;
function pwaBaslat(){
  if(!ONLINE)return;
  const m=document.createElement('link');m.rel='manifest';m.href='manifest.webmanifest';document.head.appendChild(m);
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();YUKLE_OLAY=e;if(UI.page==='ayarlar')render()});
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.register('sw.js').then(reg=>{SWREG=reg;
    const izle=w=>w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){SWBEKLEYEN=w;guncelSeritCiz()}});
    if(reg.waiting&&navigator.serviceWorker.controller){SWBEKLEYEN=reg.waiting;guncelSeritCiz()}
    reg.addEventListener('updatefound',()=>{if(reg.installing)izle(reg.installing)});
    const dene=()=>{if(navigator.onLine)reg.update().catch(()=>{})};
    setInterval(dene,30*60*1000);window.addEventListener('online',dene);document.addEventListener('visibilitychange',()=>{if(!document.hidden)dene()});
  }).catch(e=>console.warn('Servis çalışanı kaydedilemedi',e));
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(_gunc)location.reload()});
}
function guncelSeritCiz(){
  let b=document.getElementById('guncelSerit');const goster=!!SWBEKLEYEN&&!_gErtele&&S&&!SALT&&rolu()==='admin';
  if(!goster){if(b)b.remove();return}if(b)return;
  b=document.createElement('div');b.id='guncelSerit';b.style.cssText='position:fixed;right:16px;bottom:16px;z-index:60;max-width:380px;background:var(--card);color:var(--ink);border:2px solid var(--pri);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap';
  b.innerHTML='<div style="flex:1;min-width:190px"><b>Yeni sürüm hazır</b><div class="mut" style="font-size:12px">Güncellemeden önce otomatik yedek alınır.</div></div><button type="button" class="btn pri sm" data-act="guncelAyrinti">Güncelle…</button><button type="button" class="btn sm" data-act="guncelErtele" title="Sonra hatırlat" aria-label="Kapat">✕</button>';
  document.body.appendChild(b)}

/* ---- Google Drive senkronu (drive.file kapsamı: yalnızca bu uygulamanın oluşturduğu dosyaya erişir) ---- */
const DRV={tok:null,exp:0,meta:{},durum:'',busy:false,degisim:0,gecikme:45000,t:null};
const DRV_DOSYA='kobi-defter-veri.json';
async function driveMetaOku(){try{DRV.meta=(await kvGet('driveMeta'))||{}}catch(e){DRV.meta={}}}
async function driveMetaYaz(){try{await kvSet('driveMeta',DRV.meta)}catch(e){}}
function driveEk(){const m=DRV.meta;return m&&m.aktif?(m.kirli?' · Drive: bekliyor':' · Drive ✓'):''}
function driveDurum(t){DRV.durum=t;const el=$('#kayitDurum');if(el&&/kaydedildi/.test(el.textContent))el.textContent='kaydedildi'+driveEk();if(UI.page==='ayarlar'&&!MODAL)render()}
function gisYukle(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error('Google giriş betiği yüklenemedi (internet bağlantısını denetleyin)'));document.head.appendChild(s)})}
function driveToken(etkilesim){return new Promise(async(res,rej)=>{
  if(DRV.tok&&Date.now()<DRV.exp-60000)return res(DRV.tok);
  if(!etkilesim)return rej(new Error('Drive bağlantısı için "Drive\'a bağlan" düğmesine basın'));
  try{await gisYukle()}catch(e){return rej(e)}
  const tc=google.accounts.oauth2.initTokenClient({client_id:DRV.meta.clientId,scope:'https://www.googleapis.com/auth/drive.file',
    callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));DRV.tok=r.access_token;DRV.exp=Date.now()+(r.expires_in||3600)*1000;res(DRV.tok)},
    error_callback:e=>rej(new Error('Google yetkisi alınamadı'+(e&&e.type?' ('+e.type+')':'')))});
  tc.requestAccessToken({prompt:''})})}
async function driveIstek(url,opt,etkilesim){const dene=async()=>{const t=await driveToken(etkilesim);opt=opt||{};opt.headers=Object.assign({},opt.headers,{Authorization:'Bearer '+t});return fetch(url,opt)};
  let r=await dene();if(r.status===401){DRV.tok=null;r=await dene()}if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error('Drive hatası '+r.status+(m?': '+m:''))}return r}
async function driveBul(et){const q=encodeURIComponent("name='"+DRV_DOSYA+"' and trashed=false");
  const r=await driveIstek('https://www.googleapis.com/drive/v3/files?q='+q+'&spaces=drive&orderBy=modifiedTime%20desc&fields=files(id,modifiedTime,appProperties)',{},et);return (await r.json()).files||[]}
async function driveYaz(id,rev,et){const sinir='kd'+Math.random().toString(36).slice(2),meta={name:DRV_DOSYA,mimeType:'application/json',appProperties:{rev:String(rev),cihaz:(navigator.platform||'')+' '+bugun()}};
  const g='--'+sinir+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+sinir+'\r\nContent-Type: application/json\r\n\r\n'+yedekJSON()+'\r\n--'+sinir+'--';
  const u=id?'https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=multipart&fields=id,appProperties':'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,appProperties';
  const r=await driveIstek(u,{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+sinir},body:g},et);return r.json()}
async function driveIndir(id,et){const r=await driveIstek('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{},et);return JSON.parse(await r.text())}
function yedektenUygula(j,kaynak){const v=j.veri||j;if(!v.hesaplar||!v.fisler)throw new Error('Drive dosyası bir Kobi Defter yedeği değil');if((v.sema||1)>DB_SEMA)throw new Error('Drive\'daki veri daha yeni bir program sürümüyle kaydedilmiş. Önce programı güncelleyin.');
  const _e=S;S=uyumla(v);if(_e&&_e.girisAktif)girisKorun(_e);S.sema=DB_SEMA;S.appVer=APP_VER;SALT=false;_bm=null;try{demirbasHazirla();demirbasSenk()}catch(e){console.error(e)}logYaz('yedek','Veri '+kaynak+' kaynağından yüklendi');kaydet()}
function driveKirli(){if(!DRV.meta||!DRV.meta.aktif||SALT)return;DRV.degisim++;if(!DRV.meta.kirli){DRV.meta.kirli=true;driveMetaYaz()}
  clearTimeout(DRV.t);if(DRV.tok&&navigator.onLine)DRV.t=setTimeout(()=>driveSenkron({sessiz:true}).catch(()=>{}),DRV.gecikme);driveDurum('Değişiklikler Drive\'a gönderilmek üzere bekliyor')}
/* opt: {elle:true} → kullanıcı eylemi (Google penceresi açılabilir); {sessiz:true} → hata sadece durum satırına yazılır */
async function driveSenkron(opt){opt=opt||{};const m=DRV.meta;if(!m.aktif||!m.clientId||SALT)return;if(DRV.busy)return;
  if(!navigator.onLine){driveDurum('Çevrimdışı: değişiklikler internet gelince gönderilecek');return}
  DRV.busy=true;const ilk=DRV.degisim;
  try{
    driveDurum('Drive ile eşleniyor…');
    const et=!!opt.elle,fl=await driveBul(et),uz=fl[0],uzRev=uz?(+(uz.appProperties||{}).rev||0):0;
    if(!uz){const r=await driveYaz(null,1,et);m.fileId=r.id;m.rev=1;m.kirli=DRV.degisim!==ilk;await driveMetaYaz();logYaz('yedek','Drive\'a ilk kez yüklendi');driveDurum('Drive\'a yüklendi · '+new Date().toLocaleTimeString('tr-TR'));return}
    if(m.fileId===uz.id&&m.rev===uzRev){
      if(m.kirli||opt.zorla){const r=await driveYaz(uz.id,uzRev+1,et);m.rev=uzRev+1;m.kirli=DRV.degisim!==ilk;await driveMetaYaz();driveDurum('Drive ile eşlendi · '+new Date().toLocaleTimeString('tr-TR'));if(m.kirli)driveKirli()}
      else driveDurum('Drive ile eşlendi (değişiklik yok) · '+new Date().toLocaleTimeString('tr-TR'));
      return}
    /* uzaktaki sürüm bu cihazın bildiğinden farklı */
    const yerelBos=!S.fisler.length&&!S.faturalar.length&&!S.cariler.length;
    if(yerelBos||(!m.kirli&&m.fileId===uz.id&&uzRev>(m.rev||0)&&opt.otoAl)){const j=await driveIndir(uz.id,et);yedektenUygula(j,'Google Drive');m.fileId=uz.id;m.rev=uzRev;m.kirli=false;await driveMetaYaz();driveDurum('Drive\'daki veri yüklendi');toast('Drive\'daki veri bu cihaza yüklendi');location.hash='#/panel';render();return}
    DRV.cakisma={id:uz.id,rev:uzRev,zaman:uz.modifiedTime};driveCakismaGoster();driveDurum('Karar bekleniyor: Drive\'daki veri bu cihazdakinden farklı')
  }catch(e){driveDurum('Drive: '+e.message);if(!opt.sessiz)toast(e.message,'err');throw e}
  finally{DRV.busy=false}}
function driveCakismaGoster(){const c=DRV.cakisma;if(!c)return;
  modal({title:'Drive ile bu cihazdaki veri farklı',html:`<p style="margin-top:0">Drive'daki <b>${esc(DRV_DOSYA)}</b> dosyası ${c.zaman?tTR(c.zaman.slice(0,10))+' tarihinde':'başka bir cihazdan'} güncellenmiş ve bu cihazdaki veriyle aynı değil. Hangisi esas alınsın?</p><div class="bar" style="flex-direction:column;align-items:stretch;gap:8px"><button type="button" class="btn pri" data-act="driveCoz" data-k="uzak">Drive'daki veriyi al (bu cihazdaki değişir)</button><button type="button" class="btn" data-act="driveCoz" data-k="yerel">Bu cihazdaki veriyi Drive'a yaz (Drive'daki değişir)</button><button type="button" class="btn" data-act="driveCoz" data-k="iptal">Şimdilik karışma</button></div><p class="mut">Karar verirken zarar görmemesi için önce bu cihazdaki verinin yedeği dosya olarak indirilir.</p>`})}
ACT.driveCoz=async el=>{const k=el.dataset.k,c=DRV.cakisma;ACT.kapat();if(!c||k==='iptal'){DRV.cakisma=null;driveDurum('Senkron ertelendi');return}
  try{ACT.yedekAl();const m=DRV.meta;
    if(k==='uzak'){const j=await driveIndir(c.id,true);yedektenUygula(j,'Google Drive');m.fileId=c.id;m.rev=c.rev;m.kirli=false;await driveMetaYaz();toast('Drive\'daki veri yüklendi');location.hash='#/panel';render()}
    else{const r=await driveYaz(c.id,c.rev+1,true);m.fileId=c.id;m.rev=c.rev+1;m.kirli=false;await driveMetaYaz();toast('Drive güncellendi')}
    DRV.cakisma=null;driveDurum('Drive ile eşlendi · '+new Date().toLocaleTimeString('tr-TR'))}catch(e){toast(e.message,'err')}};
ACT.driveBaglan=async el=>{if(!ONLINE)return toast('Drive yalnızca çevrimiçi (https) sürümde çalışır.','err');const f=el.closest('form'),cid=(val(f,'clientId')||'').trim();
  if(!/^[\w.-]+\.apps\.googleusercontent\.com$/.test(cid))return toast('İstemci kimliği "….apps.googleusercontent.com" biçiminde olmalı. KURULUM rehberine bakın.','err');
  DRV.meta=Object.assign({},DRV.meta,{clientId:cid,aktif:true});await driveMetaYaz();
  try{await driveSenkron({elle:true});if(DRV.meta.kirli===undefined)DRV.meta.kirli=false;toast('Google Drive bağlandı');render()}catch(e){}};
ACT.driveSenkron=async()=>{if(!DRV.meta.aktif)return;try{await driveSenkron({elle:true,zorla:true})}catch(e){}render()};
ACT.driveAl=async()=>{if(!DRV.meta.aktif)return;try{const fl=await driveBul(true);if(!fl[0])return toast('Drive\'da veri dosyası yok.','err');DRV.cakisma={id:fl[0].id,rev:+(fl[0].appProperties||{}).rev||0,zaman:fl[0].modifiedTime};driveCakismaGoster()}catch(e){toast(e.message,'err')}};
ACT.driveKes=async()=>{if(!confirm('Drive bağlantısı kapatılsın mı? Drive\'daki dosya silinmez, bu cihazdaki veri de durur.'))return;DRV.meta={clientId:DRV.meta.clientId};DRV.tok=null;await driveMetaYaz();try{if(window.google&&google.accounts&&DRV.tok)google.accounts.oauth2.revoke(DRV.tok)}catch(e){}driveDurum('');toast('Drive bağlantısı kapatıldı');render()};
function onlineKartlar(){const m=DRV.meta||{},bagli=!!m.aktif;
  const sur=`<div class="card"><h3>Çevrimiçi sürüm ve güncelleme</h3>${ONLINE?`<p style="margin-top:0">Çevrimiçi sürüm çalışıyor: ilk açılıştan sonra <b>internet olmadan</b> da kullanılır; internet olduğunda yeni sürümü kendisi indirir ve yöneticiye "Güncelle" diye sorar (önce yedek alır).</p><p>Yüklü sürüm: <b>v${APP_VER}</b>${GUNC_BILGI?' · '+esc(GUNC_BILGI):''}</p><div class="bar"><button class="btn" data-act="guncelKontrol">Güncellemeyi denetle</button>${YUKLE_OLAY?'<button class="btn pri" data-act="uygulamaYukle">Uygulama olarak yükle</button>':''}</div>`:`<p style="margin-top:0">Şu an <b>dosya olarak</b> açıldı: otomatik güncelleme ve Drive senkronu çalışmaz. Çevrimiçi adresten açın (KURULUM rehberi).</p>`}</div>`;
  const drv=`<form class="card"><div class="bar" style="margin-bottom:6px"><h3 style="margin:0">Google Drive senkronu</h3><span class="sp"></span>${bilgi('İsteğe bağlı. Veriler yine bu cihazda çalışır; Drive, başka bilgisayardan devam etmek ve güvenli kopya içindir. Yalnızca bu programın oluşturduğu "kobi-defter-veri.json" dosyasına erişir. Kurulum: KURULUM rehberi.')}</div>${ONLINE?(bagli?`<p style="margin-top:0">Durum: <b>${esc(DRV.durum||(m.kirli?'Gönderilmeyi bekliyor':'Bağlı'))}</b></p><p class="mut" style="margin-top:0">Bu cihazdaki her kayıttan kısa süre sonra Drive'a gönderilir. İnternet yoksa sıraya alınır. Her oturumda bir kez "Drive'a bağlan" demeniz gerekebilir.</p><div class="bar"><button type="button" class="btn pri" data-act="driveSenkron">${DRV.tok?'Şimdi senkronla':'Drive\'a bağlan ve senkronla'}</button><button type="button" class="btn" data-act="driveAl">Drive\'daki veriyi al…</button><button type="button" class="btn red" data-act="driveKes">Bağlantıyı kes</button></div>`:`<div class="fg">${inp('OAuth istemci kimliği (Client ID)','clientId',m.clientId||'','placeholder="123456-abc.apps.googleusercontent.com"')}</div><div class="bar"><button type="button" class="btn pri" data-act="driveBaglan">Drive\'a bağlan</button></div>`):`<p style="margin-top:0" class="mut">Drive senkronu yalnızca çevrimiçi (https) sürümde kullanılabilir.</p>`}</form>`;
  return sur+drv}

async function baslat(){
  await driveMetaOku();let d=await yukle(),eskiVer=null;
  if(d&&d.hesaplar){
    if((d.sema||1)>DB_SEMA){S=d;SALT=true}
    else{eskiVer=d.appVer||'1.0';S=uyumla(d)}
  }else{S=yeniDurum();ilkKurulum()}
  if(!SALT){try{demirbasHazirla();demirbasSenk()}catch(e){console.error(e)}S.sema=DB_SEMA;S.appVer=APP_VER}
  if(navigator.storage&&navigator.storage.persist)try{navigator.storage.persist()}catch(e){}
  pwaBaslat();
  const kilitli=S.girisAktif&&!oturumGeriYukle();
  route();
  const devam=()=>{
  if(SALT){
    modal({title:'Bu dosya eski bir sürüm',html:`<p style="margin-top:0">Verileriniz bu dosyadan daha yeni bir program sürümüyle kaydedilmiş. Eski dosya yeni veriyi bozabileceği için <b>salt okunur</b> açıldı; hiçbir şey değiştirilmez ve kaydedilmez.</p><p>Çözüm: en güncel <b>kobi-defter.html</b> dosyasını kullanın. Verilerinize dokunulmadı.</p>`});
  }else if(eskiVer&&eskiVer!==APP_VER&&S.fisler.length){
    kaydet();
    modal({title:'Program güncellendi (v'+eskiVer+' → v'+APP_VER+')',html:`<p style="margin-top:0">Verileriniz korundu ve yeni sürüme uyarlandı. Güvenli olması için şimdi bir yedek almanızı öneririz.</p><div class="bar"><button type="button" class="btn pri" data-act="yedekAl">⬇ Yedek indir</button></div>`});
  }else if(eskiVer!==null&&eskiVer!==APP_VER){kaydet()}
  if(!SALT&&!S.ayar.kuruldu&&!S.fisler.length){
    modal({title:'Kobi Defter\'e hoş geldiniz',html:`<p style="margin-top:0">Küçük işletmeler için sade ama çift taraflı muhasebe mantığıyla çalışan ön muhasebe programı. İnternet gerekmez; verileriniz bu bilgisayarda saklanır.</p><div class="fg">${inp('Firma ünvanı','ad','','required placeholder="Örn: Yıldız Market"')}</div><p class="mut">İsterseniz önce <b>örnek veriyle</b> programı gezebilirsiniz (Ayarlar › Örnek veri); sonra sıfırlayıp kendi verinizi girersiniz.</p>`,okLabel:'Başla',
     ok:f=>{S.firma.ad=val(f,'ad');S.ayar.kuruldu=true;kaydet();render();return true}});
  }
  };
  if(kilitli){_girisSonrasi=devam;girisGoster()}else devam();
}
baslat();
</script>
